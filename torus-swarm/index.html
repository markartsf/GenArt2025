<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torus Swarm — Audio Reactive</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #d0e8ff;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    #container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #controls {
      padding: 10px 18px;
      background: rgba(0, 4, 18, 0.92);
      border-bottom: 1px solid rgba(0, 180, 255, 0.18);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      z-index: 10;
      font-size: 12px;
    }

    #title {
      font-size: 13px;
      letter-spacing: 2px;
      color: #00c8ff;
      text-transform: uppercase;
      margin-right: 6px;
    }

    button {
      background: #0a1428;
      color: #d0e8ff;
      border: 1px solid rgba(0, 180, 255, 0.3);
      padding: 5px 14px;
      border-radius: 3px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      letter-spacing: 1px;
    }
    button:hover  { background: #102040; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }

    #fullscreenBtn {
      border-color: rgba(100, 220, 255, 0.3);
      margin-left: auto;
    }

    input[type="file"] {
      background: #080f20;
      color: #90c8e8;
      border: 1px solid rgba(0, 180, 255, 0.2);
      padding: 4px 8px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      cursor: pointer;
    }
    input[type="file"]::-webkit-file-upload-button {
      background: #0a1428;
      color: #d0e8ff;
      border: none;
      padding: 3px 8px;
      border-radius: 2px;
      cursor: pointer;
      margin-right: 6px;
      font-size: 11px;
    }

    #status {
      font-size: 11px;
      color: #6090a8;
      min-width: 280px;
    }
    #status.loading { color: #00c8ff; }
    #status.ready   { color: #60e8a0; }
    #status.error   { color: #ff6b6b; }

    #meters {
      display: flex;
      gap: 10px;
      font-size: 10px;
      color: #406080;
    }
    .meter { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .meter-bar {
      width: 6px;
      height: 30px;
      background: #080f20;
      border-radius: 2px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
    }
    .meter-fill { width: 100%; border-radius: 2px; transition: height 0.05s; }
    .bass-fill { background: #00aaff; }
    .mid-fill  { background: #7060ee; }
    .high-fill { background: #00e8cc; }

    #threejs-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    #threejs-container canvas {
      display: block;
    }

    :fullscreen #controls,
    :-webkit-full-screen #controls,
    :-moz-full-screen #controls { display: none; }
  </style>
</head>
<body>
<div id="container">
  <div id="controls">
    <span id="title">Torus Swarm</span>

    <button id="playBtn" disabled>Play</button>
    <button id="stopBtn" disabled>Stop</button>

    <div id="meters">
      <div class="meter">
        <div class="meter-bar"><div id="bassMeter" class="meter-fill bass-fill" style="height:0%"></div></div>
        <span>B</span>
      </div>
      <div class="meter">
        <div class="meter-bar"><div id="midMeter" class="meter-fill mid-fill" style="height:0%"></div></div>
        <span>M</span>
      </div>
      <div class="meter">
        <div class="meter-bar"><div id="highMeter" class="meter-fill high-fill" style="height:0%"></div></div>
        <span>H</span>
      </div>
    </div>

    <span id="status" class="loading">Loading audio...</span>

    <input type="file" id="audioFile" accept="audio/*" title="Load a different audio file">

    <button id="fullscreenBtn">[ Fullscreen ]</button>
  </div>

  <div id="threejs-container"></div>
</div>

<script type="module" src="./sketch.js"></script>
</body>
</html>
