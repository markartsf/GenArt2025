<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noise Field Flow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
    canvas { display: block; }
    #ui {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 12px; z-index: 10;
    }
    button {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
      color: #fff; padding: 8px 18px; border-radius: 20px; cursor: pointer;
      font-size: 13px; letter-spacing: 0.5px; transition: background 0.2s;
    }
    button:hover { background: rgba(255,255,255,0.2); }
    #info {
      position: fixed; top: 16px; left: 20px;
      color: rgba(255,255,255,0.4); font-family: monospace; font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="info">NOISE FIELD FLOW &nbsp;|&nbsp; p5.js</div>
  <div id="ui">
    <button onclick="clearCanvas()">Clear</button>
    <button onclick="randomizePalette()">Palette</button>
    <button onclick="toggleFlow()">Pause</button>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
