<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Brushstroke v2 — Phase 1 scaffold</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #1a1a1a;
      color: #ddd;
      font-family: 'SF Mono', Menlo, monospace;
      font-size: 12px;
      overflow: hidden;
    }
    #container { display: flex; flex-direction: column; height: 100vh; }
    #controls {
      padding: 10px 16px;
      background: rgba(20,20,20,0.95);
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
      row-gap: 8px;
    }
    #title {
      font-size: 12px;
      letter-spacing: 2px;
      color: #a9c1ff;
      text-transform: uppercase;
      margin-right: 4px;
    }
    button {
      background: #2a2a2a;
      color: #ddd;
      border: 1px solid #444;
      padding: 5px 12px;
      border-radius: 3px;
      cursor: pointer;
      font: inherit;
      font-size: 11px;
    }
    button:hover { background: #353535; }
    #status {
      color: #9fd1a0;
      font-size: 11px;
      margin-left: auto;
    }
    #status.fail { color: #ff9a9a; }
    #status.warn { color: #ffb86c; }
    #canvas-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0c0c0c;
      padding: 20px;
    }
    canvas {
      background: #fffceb;
      display: block;
      box-shadow: 0 4px 30px rgba(0,0,0,0.6);
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="controls">
      <span id="title">project brushstroke v2 — phase 1 scaffold</span>
      <button id="regenBtn">↻ Regenerate</button>
      <span id="status">loading…</span>
    </div>
    <div id="canvas-container">
      <canvas id="main"></canvas>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/spectral.js"></script>
  <script>
    // ─── Setup ─────────────────────────────────────────────────────────────────
    // Vanilla 2D canvas, pixel coordinates (top-left origin). No WEBGL, no p5,
    // no offscreen buffers. This is the simplest possible setup and the one
    // we'll build on. The clipping bug from project-brushstroke v1 cannot
    // occur here — no matrix transforms, no shader passes, no WEBGL center
    // origin. Every brush.fill / brush.line operation goes directly to pixel
    // (x, y) on this canvas.

    const canvas = document.getElementById('main');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    // Canvas dimensions — fit container with portrait-ish aspect.
    function sizeCanvas() {
      const wrap = document.getElementById('canvas-container');
      const maxW = wrap.clientWidth - 40;
      const maxH = wrap.clientHeight - 40;
      const aspect = 0.85;  // width/height
      const h = Math.min(maxH, Math.floor(maxW / aspect));
      const w = Math.floor(h * aspect);
      canvas.width = w;
      canvas.height = h;
    }
    sizeCanvas();

    // ─── Spectral.js wrapper ───────────────────────────────────────────────────
    // Handles v3 API (Color constructor) and v2 (legacy) automatically.
    // Returns a hex string for any two-colour mix with weight t in [0..1].
    function mixHex(a, b, t) {
      if (typeof spectral === 'undefined') {
        throw new Error('spectral.js not loaded');
      }
      if (typeof spectral.Color === 'function') {
        const c1 = new spectral.Color(a);
        const c2 = new spectral.Color(b);
        const result = spectral.mix([c1, 1 - t], [c2, t]);
        return typeof result.toString === 'function' ? result.toString() : ('#' + result);
      }
      return spectral.mix(a, b, t);
    }

    function setStatus(text, level) {
      statusEl.textContent = text;
      statusEl.className = level || '';
    }

    // ─── Phase 1 test pattern ──────────────────────────────────────────────────
    // The point of this phase is to PROVE pixel coordinates work edge-to-edge.
    // We draw:
    //   1. A solid marker at each of the 4 canvas corners
    //   2. A diagonal line from top-left to bottom-right
    //   3. A second diagonal from top-right to bottom-left
    //   4. Three overlapping circles in the middle, spectrally mixed
    // If everything appears in the right places, the clipping bug from v1
    // is not present, and we have a working foundation.
    function renderTestPattern() {
      const w = canvas.width, h = canvas.height;

      // Clear with palette background (Blanc Ivoire cream)
      ctx.fillStyle = '#fffceb';
      ctx.fillRect(0, 0, w, h);

      // 1. Corner markers — solid 30×30 squares at each corner, distinct colours
      const corners = [
        { x: 0,       y: 0,       c: '#c8491b', label: 'TL' },  // top-left, red-brown
        { x: w - 30,  y: 0,       c: '#002185', label: 'TR' },  // top-right, blue
        { x: 0,       y: h - 30,  c: '#076d16', label: 'BL' },  // bottom-left, green
        { x: w - 30,  y: h - 30,  c: '#feec00', label: 'BR' },  // bottom-right, yellow
      ];
      ctx.font = '11px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (const c of corners) {
        ctx.fillStyle = c.c;
        ctx.fillRect(c.x, c.y, 30, 30);
        ctx.fillStyle = '#fff';
        ctx.fillText(c.label, c.x + 15, c.y + 15);
      }

      // 2. & 3. Diagonals from corner to corner
      ctx.strokeStyle = 'rgba(40, 40, 40, 0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, 0);     ctx.lineTo(w, h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(w, 0);     ctx.lineTo(0, h); ctx.stroke();

      // 4. Centred spectral-mix demo: three overlapping circles
      const cx = w / 2, cy = h / 2;
      const r = Math.min(w, h) * 0.18;

      // Position circles in a triangle
      const positions = [
        { x: cx - r * 0.55, y: cy - r * 0.30, c: '#FFD300' },  // yellow
        { x: cx + r * 0.55, y: cy - r * 0.30, c: '#002185' },  // blue
        { x: cx,            y: cy + r * 0.60, c: '#FF2702' },  // red
      ];

      // Stamp each base circle with low alpha
      for (const p of positions) {
        ctx.fillStyle = p.c;
        ctx.globalAlpha = 0.7;
        ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Now overlay the spectrally-mixed overlap regions using clip-and-fill
      const yb = mixHex(positions[0].c, positions[1].c, 0.5);
      const br = mixHex(positions[1].c, positions[2].c, 0.5);
      const ry = mixHex(positions[2].c, positions[0].c, 0.5);

      ctx.save();
      ctx.beginPath(); ctx.arc(positions[0].x, positions[0].y, r, 0, Math.PI*2); ctx.clip();
      ctx.fillStyle = yb;
      ctx.beginPath(); ctx.arc(positions[1].x, positions[1].y, r, 0, Math.PI*2); ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.beginPath(); ctx.arc(positions[1].x, positions[1].y, r, 0, Math.PI*2); ctx.clip();
      ctx.fillStyle = br;
      ctx.beginPath(); ctx.arc(positions[2].x, positions[2].y, r, 0, Math.PI*2); ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.beginPath(); ctx.arc(positions[2].x, positions[2].y, r, 0, Math.PI*2); ctx.clip();
      ctx.fillStyle = ry;
      ctx.beginPath(); ctx.arc(positions[0].x, positions[0].y, r, 0, Math.PI*2); ctx.fill();
      ctx.restore();

      // Labels for the spectral mix demo
      ctx.fillStyle = '#222';
      ctx.font = '10px monospace';
      ctx.textAlign = 'left';
      ctx.fillText(`y+b → ${yb}`, 12, h - 50);
      ctx.fillText(`b+r → ${br}`, 12, h - 36);
      ctx.fillText(`r+y → ${ry}`, 12, h - 22);
    }

    // ─── Wire up + run ─────────────────────────────────────────────────────────
    document.getElementById('regenBtn').addEventListener('click', () => {
      setStatus('rendering…', 'warn');
      // Allow status repaint before sync render
      setTimeout(() => {
        try {
          renderTestPattern();
          setStatus(`done · canvas ${canvas.width}×${canvas.height} · all corners painted`);
        } catch (e) {
          setStatus('FAILED: ' + e.message, 'fail');
          console.error(e);
        }
      }, 10);
    });

    window.addEventListener('resize', () => {
      sizeCanvas();
      renderTestPattern();
    });

    // Initial render — wait for spectral.js to load
    function tryInitialRender() {
      if (typeof spectral === 'undefined') {
        setStatus('waiting for spectral.js…', 'warn');
        setTimeout(tryInitialRender, 100);
        return;
      }
      try {
        renderTestPattern();
        setStatus(`done · canvas ${canvas.width}×${canvas.height} · all corners painted`);
      } catch (e) {
        setStatus('FAILED: ' + e.message, 'fail');
        console.error(e);
      }
    }
    tryInitialRender();
  </script>
</body>
</html>
