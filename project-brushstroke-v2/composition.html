<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Brushstroke v2 — Scenes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #1a1a1a;
      color: #ddd;
      font-family: 'SF Mono', Menlo, monospace;
      font-size: 11px;
      overflow: hidden;
    }
    #container { display: flex; height: 100vh; }

    /* Sidebar */
    #sidebar {
      width: 270px;
      flex-shrink: 0;
      background: #121212;
      border-right: 1px solid #2a2a2a;
      overflow-y: auto;
      padding: 12px 14px;
    }
    #sidebar h1 {
      font-size: 11px;
      letter-spacing: 0.15em;
      color: #a9c1ff;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    #sidebar .subtitle { color: #666; font-size: 10px; margin-bottom: 14px; }
    #sidebar .group {
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1f1f1f;
    }
    #sidebar .group:last-child { border-bottom: none; }
    #sidebar .group-title {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: #9fd1a0;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    #sidebar label.block {
      display: block;
      margin-bottom: 8px;
      color: #888;
    }
    #sidebar label.block > span.l {
      display: inline-block;
      width: 100%;
      color: #aaa;
      margin-bottom: 3px;
      font-size: 10px;
    }
    #sidebar label.block > span.l > span.v {
      float: right;
      color: #6da9ff;
    }
    #sidebar label.flex {
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 6px; color: #888;
      cursor: pointer;
    }
    #sidebar input[type=range] {
      width: 100%;
      accent-color: #6da9ff;
    }
    #sidebar button, #sidebar select {
      width: 100%;
      background: #232323;
      color: #ddd;
      border: 1px solid #3a3a3a;
      padding: 5px 8px;
      border-radius: 3px;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
      margin-bottom: 4px;
    }
    #sidebar button:hover, #sidebar select:hover { background: #2c2c2c; }
    #sidebar button.primary { background: #2a3a5a; border-color: #3a4a6a; }
    #sidebar button.primary:hover { background: #344a72; }
    #sidebar button.row { width: 49%; display: inline-block; }
    #sidebar .row-pair { display: flex; gap: 4px; }
    #sidebar .status { color: #9fd1a0; font-size: 10px; margin-top: 8px; }
    #sidebar .status.warn { color: #ffb86c; }
    #sidebar .status.fail { color: #ff9a9a; }

    /* Canvas area */
    #canvas-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0c0c0c;
      padding: 20px;
    }
    canvas {
      background: #fffceb;
      display: block;
      box-shadow: 0 4px 30px rgba(0,0,0,0.6);
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="sidebar">
      <h1>Project Brushstroke</h1>
      <div class="subtitle">Phase 4b — scene editor</div>

      <nav style="display:flex;gap:8px;margin-bottom:12px;font-size:10px;letter-spacing:0.08em;">
        <a href="brushes.html" style="color:#6da9ff;text-decoration:none;">Brushes</a>
        <span style="color:#9fd1a0;font-weight:bold;">Scenes</span>
      </nav>

      <div class="group">
        <div class="group-title">Scene</div>
        <select id="brushSel"></select>
        <div class="row-pair">
          <button id="saveAsBtn" class="row">★ Save as scene…</button>
          <button id="deleteBtn" class="row">× Delete scene</button>
        </div>
      </div>

      <div class="group">
        <div class="group-title">Palette &amp; layout</div>
        <select id="paletteSel"></select>
        <select id="densitySel">
          <option value="sparse">Density — sparse</option>
          <option value="medium" selected>Density — medium</option>
          <option value="dense">Density — dense</option>
        </select>
        <label class="flex"><input type="checkbox" id="bgWash" checked>bg wash</label>
        <label class="flex"><input type="checkbox" id="crossMarks" checked>+ marks</label>
        <label class="flex"><input type="checkbox" id="colorCurves" checked>color curves</label>
        <label class="flex"><input type="checkbox" id="dashedFrame">dashed frame</label>
        <label class="block"><span class="l">starburst prob<span class="v" data-display="starburstProb"></span></span>
          <input type="range" id="starburstProb" min="0" max="0.60" step="0.01"></label>
      </div>

      <div class="group">

        <label class="block"><span class="l">prob<span class="v" data-display="underWashProb"></span></span>
          <input type="range" id="underWashProb" min="0" max="1" step="0.01"></label>
        <label class="block"><span class="l">opacity (mid)<span class="v" data-display="underWashOpacity"></span></span>
          <input type="range" id="underWashOpacity" min="0.05" max="0.65" step="0.01"></label>
        <label class="block"><span class="l">bleed<span class="v" data-display="underWashBleed"></span></span>
          <input type="range" id="underWashBleed" min="0.1" max="0.8" step="0.01"></label>
      </div>

      <div class="group">
        <div class="group-title">Colour</div>
        <label class="block"><span class="l">cycle rate<span class="v" data-display="cycleRate"></span></span>
          <input type="range" id="cycleRate" min="1" max="8" step="0.1"></label>
        <label class="block"><span class="l">jitter<span class="v" data-display="colorJitter"></span></span>
          <input type="range" id="colorJitter" min="0" max="0.20" step="0.005"></label>
      </div>

      <div class="group">
        <div class="group-title">Brush mix</div>
        <label class="block"><span class="l">fat lozenge<span class="v" data-display="mixFat"></span></span>
          <input type="range" id="mixFat" min="0" max="100" step="1"></label>
        <label class="block"><span class="l">chalk drag<span class="v" data-display="mixChalkDrag"></span></span>
          <input type="range" id="mixChalkDrag" min="0" max="100" step="1"></label>
        <label class="block"><span class="l">hair line<span class="v" data-display="mixHair"></span></span>
          <input type="range" id="mixHair" min="0" max="100" step="1"></label>
        <label class="block"><span class="l">chalk scribble<span class="v" data-display="mixChalkScribble"></span></span>
          <input type="range" id="mixChalkScribble" min="0" max="100" step="1"></label>
      </div>

      <div class="group">
        <div class="group-title">Actions</div>
        <button id="newBtn" class="primary">↻ New (R)</button>
        <button id="saveBtn">💾 Save PNG (S)</button>
        <div class="status" id="status">loading…</div>
      </div>
    </div>

    <div id="canvas-container">
      <canvas id="main"></canvas>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/spectral.js"></script>
  <script src="./brushes.js"></script>
  <script>
  // ──────────────────────────────────────────────────────────────────────────
  // Palettes (Alejandro's 8)
  // ──────────────────────────────────────────────────────────────────────────
  const PALETTES = [
    { name: 'Blanc Ivoire',        bg: '#fffceb', colors: ['#2c695a','#4ad6af','#7facc6','#4e93cc','#f6684f','#ffd300'] },
    { name: 'Outremer Gris',       bg: '#e2e7dc', colors: ['#7b4800','#002185','#003c32','#fcd300','#ff2702','#6b9404'] },
    { name: 'Gris Clair',          bg: '#ccccc6', colors: ['#474238','#f4bd48','#9c2128','#395a8e','#7facc6','#2c695a'] },
    { name: 'Le Rubis',            bg: '#ffe6d4', colors: ['#6c2b3b','#c76282','#445e87','#003c32','#e0b411','#c8491b'] },
    { name: 'Playgrounds',         bg: '#c49a70', colors: ['#4e0042','#002185','#076d16','#feec00','#ff6900','#ff2702'] },
    { name: 'Bleu Outremer',       bg: '#4e6498', colors: ['#cdd3e3','#c6353c','#f6684f','#fcd300','#488b6d','#7fb4b5'] },
    { name: 'Bleu Outremer Foncé', bg: '#0e2d58', colors: ['#f4f4f4','#c8c9ca','#939598','#616568','#0e1318','#080f15'] },
    { name: "Noir d'Ivoire",       bg: '#080f15', colors: ['#C8C1B7','#d7d7d7','#b0b0b0','#8b8b8b','#676767','#464646'] },
  ];

  // ──────────────────────────────────────────────────────────────────────────
  // Built-in brushes (was "Styles" in Phase 3). Each is a complete bundle
  // of doodle-engine parameters. Custom brushes get saved alongside these
  // in localStorage; they show with a ★ prefix in the dropdown.
  // ──────────────────────────────────────────────────────────────────────────
  const BUILT_IN_BRUSHES = {
    'Soft & dreamy': {
      brushMix: { fatLozenge: 55, chalkDrag: 22, hairLine: 15, chalkScribble: 8 },
      brushOpts: { opacity: 0.70, jitterAngle: 6, blend: true },
      angleJitter: 10,
      lengthClasses: [
        { frac: [0.80, 1.05], weight: 0.55 },
        { frac: [0.50, 0.80], weight: 0.30 },
        { frac: [0.20, 0.50], weight: 0.15 },
      ],
      skipProb: 0.06,
      secondaryBrushProb: 0.12,
      secondaryBrush: 'hairLine',
      stopCount: [3, 5], cycleRate: 3, colorJitter: 0.05,
      weightRange: [3.5, 7.0], weightJitter: [0.85, 1.15],
      underWashProb: 0.6, underWashOpacity: 0.38, underWashBleed: 0.42,
      halfWidthRange: [0.20, 0.50], teethMultiplier: 1.0,
      starburstProb: 0.20,
    },
    'Enfantines hard-edge': {
      brushMix: { fatLozenge: 85, chalkDrag: 5, hairLine: 10, chalkScribble: 0 },
      brushOpts: { opacity: 0.88, jitterAngle: 3, blend: true },
      angleJitter: 4,
      lengthClasses: [
        { frac: [0.85, 1.05], weight: 0.75 },
        { frac: [0.55, 0.85], weight: 0.25 },
      ],
      skipProb: 0.03,
      secondaryBrushProb: 0.0,
      secondaryBrush: 'hairLine',
      stopCount: [4, 7], cycleRate: 5, colorJitter: 0.02,
      weightRange: [3.5, 5.5], weightJitter: [0.95, 1.05],
      underWashProb: 0.4, underWashOpacity: 0.25, underWashBleed: 0.30,
      halfWidthRange: [0.22, 0.45], teethMultiplier: 1.25,
      starburstProb: 0.15,
    },
    'Crisp colored pencil': {
      brushMix: { fatLozenge: 0, chalkDrag: 10, hairLine: 75, chalkScribble: 15 },
      brushOpts: { opacity: 0.85, blend: false },
      angleJitter: 12,
      lengthClasses: [
        { frac: [0.75, 1.10], weight: 0.40 },
        { frac: [0.40, 0.75], weight: 0.40 },
        { frac: [0.15, 0.40], weight: 0.20 },
      ],
      skipProb: 0.08,
      secondaryBrushProb: 0.18,
      secondaryBrush: 'chalkScribble',
      stopCount: [3, 6], cycleRate: 4, colorJitter: 0.04,
      weightRange: [0.8, 1.6], weightJitter: [0.9, 1.1],
      underWashProb: 0.55, underWashOpacity: 0.32, underWashBleed: 0.40,
      halfWidthRange: [0.22, 0.45], teethMultiplier: 1.5,
      starburstProb: 0.30,
    },
    'Chunky stripes': {
      brushMix: { fatLozenge: 70, chalkDrag: 18, hairLine: 4, chalkScribble: 8 },
      brushOpts: { opacity: 0.82, jitterAngle: 5, blend: true },
      angleJitter: 6,
      lengthClasses: [
        { frac: [0.90, 1.05], weight: 0.65 },
        { frac: [0.55, 0.90], weight: 0.30 },
        { frac: [0.25, 0.55], weight: 0.05 },
      ],
      skipProb: 0.04,
      secondaryBrushProb: 0.08,
      secondaryBrush: 'hairLine',
      stopCount: [3, 5], cycleRate: 4, colorJitter: 0.03,
      weightRange: [6.0, 9.5], weightJitter: [0.92, 1.08],
      underWashProb: 0.5, underWashOpacity: 0.31, underWashBleed: 0.35,
      halfWidthRange: [0.28, 0.50], teethMultiplier: 0.90,
      starburstProb: 0.10,
    },
  };

  // Deep clone helper for brush params
  function cloneBrush(b) {
    return JSON.parse(JSON.stringify(b));
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Custom brush storage
  // ──────────────────────────────────────────────────────────────────────────
  // One-time migration from old key
  (function() {
    const OLD = 'project-brushstroke-brushes-v1';
    const NEW = 'project-brushstroke-scenes-v1';
    if (localStorage.getItem(OLD) && !localStorage.getItem(NEW)) {
      localStorage.setItem(NEW, localStorage.getItem(OLD));
      localStorage.removeItem(OLD);
    }
  })();

  const STORAGE_KEY = 'project-brushstroke-scenes-v1';
  function loadCustomBrushes() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch (e) { return {}; }
  }
  function saveCustomBrushes(map) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(map)); }
    catch (e) { console.warn('Save failed:', e); }
  }
  function getAllBrushes() {
    return { ...BUILT_IN_BRUSHES, ...loadCustomBrushes() };
  }

  // ──────────────────────────────────────────────────────────────────────────
  // State
  // ──────────────────────────────────────────────────────────────────────────
  let palette = PALETTES[0];
  let brushName = 'Soft & dreamy';
  let activeBrush = cloneBrush(BUILT_IN_BRUSHES[brushName]);
  let density = 'medium';
  let opts = { bgWash: true, crossMarks: true, colorCurves: true, dashedFrame: false };
  let canvasW, canvasH;
  let canvas, ctx;

  const { rand, randI, choice, catmullRom, tangent, sampleGradient,
          hairLine, fatLozenge, chalkDrag, chalkScribble, gesturalSweep,
          watercolorWash, registrationCross, callBrush } = B;

  // Weighted pick from a {key: weight} map
  function weightedChoice(map) {
    const keys = Object.keys(map);
    let total = 0;
    for (const k of keys) total += map[k];
    if (total <= 0) return keys[0];
    let r = Math.random() * total;
    for (const k of keys) {
      r -= map[k];
      if (r <= 0) return k;
    }
    return keys[keys.length - 1];
  }
  function pickLengthFrac(classes) {
    let total = 0;
    for (const c of classes) total += c.weight;
    let r = Math.random() * total;
    for (const c of classes) {
      r -= c.weight;
      if (r <= 0) return rand(c.frac[0], c.frac[1]);
    }
    return rand(classes[classes.length - 1].frac[0], classes[classes.length - 1].frac[1]);
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Canvas setup
  // ──────────────────────────────────────────────────────────────────────────
  function sizeCanvas() {
    const wrap = document.getElementById('canvas-container');
    const maxW = wrap.clientWidth - 40, maxH = wrap.clientHeight - 40;
    const aspect = 0.85;
    const h = Math.min(maxH, Math.floor(maxW / aspect));
    const w = Math.floor(h * aspect);
    canvas.width = w;
    canvas.height = h;
    canvasW = w;
    canvasH = h;
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Doodle generation
  // ──────────────────────────────────────────────────────────────────────────
  function generateDoodles(count, br) {
    const cols = Math.ceil(Math.sqrt(count * 0.7));
    const rows = Math.ceil(count / cols);
    const cellW = canvasW / cols;
    const cellH = canvasH / rows;
    const doodles = [];
    let idx = 0;
    for (let r = 0; r < rows && idx < count; r++) {
      for (let c = 0; c < cols && idx < count; c++) {
        const cx = (c + 0.5) * cellW + rand(-cellW * 0.30, cellW * 0.30);
        const cy = (r + 0.5) * cellH + rand(-cellH * 0.30, cellH * 0.30);
        const cellMin = Math.min(cellW, cellH);
        const sizeRoll = Math.random();
        const size = sizeRoll < 0.25
          ? rand(cellMin * 0.35, cellMin * 0.65)
          : sizeRoll < 0.75
          ? rand(cellMin * 0.70, cellMin * 1.10)
          : rand(cellMin * 1.10, cellMin * 1.55);
        const angle = rand(0, Math.PI * 2);

        const stopCount = randI(br.stopCount[0], br.stopCount[1]);
        const stops = [];
        const used = new Set();
        while (stops.length < stopCount && used.size < palette.colors.length) {
          const ci = randI(0, palette.colors.length - 1);
          if (!used.has(ci)) { used.add(ci); stops.push(palette.colors[ci]); }
        }

        const isStarburst = Math.random() < (br.starburstProb || 0);
        if (isStarburst) {
          const spokeCount = randI(10, 20) +
            Math.floor(({ sparse: -3, medium: 0, dense: 4 }[density]));
          doodles.push({
            kind: 'starburst', cx, cy, size, colorStops: stops,
            spokeCount, lengthRange: [size * 0.30, size * 0.70],
          });
        } else {
          const spineLen = size * rand(0.55, 1.10);
          const halfLen = spineLen / 2;
          const perpA = angle + Math.PI / 2;
          const spinePts = [];
          for (let i = 0; i < 4; i++) {
            const t = i / 3;
            const along = -halfLen + (2 * halfLen) * t;
            const wobble = rand(-size * 0.20, size * 0.20);
            spinePts.push({
              x: cx + Math.cos(angle) * along + Math.cos(perpA) * wobble,
              y: cy + Math.sin(angle) * along + Math.sin(perpA) * wobble,
            });
          }
          const teethCount = Math.floor(rand(14, 28) * br.teethMultiplier *
            ({ sparse: 0.7, medium: 1.0, dense: 1.3 }[density]));
          const halfWidth = rand(size * br.halfWidthRange[0], size * br.halfWidthRange[1]);
          const fanStyle = choice(['symmetric', 'one-sided', 'staggered', 'tapered']);
          doodles.push({
            kind: 'fan',
            cx, cy, size, angle, spinePts, colorStops: stops,
            halfWidth, teethCount, fanStyle,
          });
        }
        idx++;
      }
    }
    return doodles;
  }

  function pickWashShape(cx, cy, w, h) {
    const r = Math.random();
    if (r < 0.55) return { type: 'blob',    cx, cy, w, h };
    if (r < 0.85) return { type: 'ellipse', cx, cy, w, h };
    return { type: 'rect', cx, cy, w, h };
  }

  function drawDoodle(d, br) {
    if (d.kind === 'starburst') drawStarburst(d, br);
    else                         drawFan(d, br);
  }

  function drawFan(d, br) {
    if (Math.random() < br.underWashProb) {
      const washCol = choice(d.colorStops);
      watercolorWash(ctx, pickWashShape(d.cx, d.cy, d.size * 0.85, d.size * 0.85), {
        color: washCol,
        opacity: br.underWashOpacity * rand(0.7, 1.3),
        bleed: br.underWashBleed * rand(0.85, 1.15),
      });
    }
    const N = d.teethCount;
    for (let i = 0; i < N; i++) {
      if (Math.random() < br.skipProb) continue;
      const t = i / (N - 1);
      const here = catmullRom(d.spinePts, t);
      const tan = tangent(d.spinePts, t);
      const angleJit = rand(-br.angleJitter, br.angleJitter) * Math.PI / 180;
      const perpA = tan + Math.PI / 2 + angleJit;

      const colorT = ((t * br.cycleRate) + rand(-br.colorJitter, br.colorJitter)) % 1;
      const col = sampleGradient(d.colorStops, (colorT + 1) % 1);

      let halfA, halfB;
      switch (d.fanStyle) {
        case 'symmetric':
          halfA = d.halfWidth * rand(0.7, 1.0);
          halfB = d.halfWidth * rand(0.7, 1.0);
          break;
        case 'one-sided':
          halfA = d.halfWidth * rand(0.85, 1.05);
          halfB = d.halfWidth * 0.05;
          break;
        case 'staggered':
          halfA = d.halfWidth * (i % 2 === 0 ? rand(0.9, 1.05) : rand(0.4, 0.6));
          halfB = d.halfWidth * (i % 2 === 1 ? rand(0.9, 1.05) : rand(0.4, 0.6));
          break;
        case 'tapered':
          const taper = Math.sin(t * Math.PI);
          halfA = d.halfWidth * taper * rand(0.85, 1.05);
          halfB = d.halfWidth * taper * rand(0.85, 1.05);
          break;
      }
      const lenFrac = pickLengthFrac(br.lengthClasses);
      halfA *= lenFrac;
      halfB *= lenFrac;

      const baseW = rand(br.weightRange[0], br.weightRange[1]);
      const weight = baseW * rand(br.weightJitter[0], br.weightJitter[1]);

      const toothPath = [
        { x: here.x - Math.cos(perpA) * halfA, y: here.y - Math.sin(perpA) * halfA },
        { x: here.x + Math.cos(perpA) * halfB, y: here.y + Math.sin(perpA) * halfB },
      ];
      const brushName = weightedChoice(br.brushMix);
      callBrush(ctx, brushName, toothPath, {
        color: col, weight,
        opacity: br.brushOpts.opacity,
        blend: br.brushOpts.blend !== false,
        jitterAngle: br.brushOpts.jitterAngle,
      });
      if (Math.random() < br.secondaryBrushProb) {
        const accentT = (colorT + 0.5) % 1;
        const accentCol = sampleGradient(d.colorStops, accentT);
        const accentScale = rand(0.55, 0.85);
        const accentPath = [
          { x: here.x - Math.cos(perpA) * halfA * accentScale, y: here.y - Math.sin(perpA) * halfA * accentScale },
          { x: here.x + Math.cos(perpA) * halfB * accentScale, y: here.y + Math.sin(perpA) * halfB * accentScale },
        ];
        callBrush(ctx, br.secondaryBrush || 'hairLine', accentPath, {
          color: accentCol, weight: rand(0.5, 1.2),
          opacity: 0.8, blend: false,
        });
      }
    }
  }

  function drawStarburst(d, br) {
    if (Math.random() < br.underWashProb) {
      const washCol = choice(d.colorStops);
      watercolorWash(ctx, pickWashShape(d.cx, d.cy, d.size * 0.7, d.size * 0.7), {
        color: washCol,
        opacity: br.underWashOpacity * rand(0.7, 1.3),
        bleed: br.underWashBleed * rand(0.85, 1.15),
      });
    }
    const N = d.spokeCount;
    const baseAngle = rand(0, Math.PI * 2);
    for (let i = 0; i < N; i++) {
      if (Math.random() < br.skipProb) continue;
      const evenAngle = baseAngle + (i / N) * Math.PI * 2;
      const angleJit = rand(-br.angleJitter, br.angleJitter) * Math.PI / 180;
      const ang = evenAngle + angleJit;
      const lenFrac = pickLengthFrac(br.lengthClasses);
      const baseLen = rand(d.lengthRange[0], d.lengthRange[1]);
      const len = baseLen * lenFrac;
      const innerR = len * 0.10;
      const path = [
        { x: d.cx + Math.cos(ang) * innerR,        y: d.cy + Math.sin(ang) * innerR },
        { x: d.cx + Math.cos(ang) * len * 0.4,     y: d.cy + Math.sin(ang) * len * 0.4 },
        { x: d.cx + Math.cos(ang) * len * 0.8,     y: d.cy + Math.sin(ang) * len * 0.8 },
        { x: d.cx + Math.cos(ang) * len,           y: d.cy + Math.sin(ang) * len },
      ];
      const colorT = (i / N + rand(-br.colorJitter, br.colorJitter)) % 1;
      const col = sampleGradient(d.colorStops, (colorT + 1) % 1);
      const baseW = rand(br.weightRange[0], br.weightRange[1]);
      const weight = baseW * rand(br.weightJitter[0], br.weightJitter[1]);
      const brushName = weightedChoice(br.brushMix);
      callBrush(ctx, brushName, path, {
        color: col, weight,
        opacity: br.brushOpts.opacity,
        blend: br.brushOpts.blend !== false,
        jitterAngle: br.brushOpts.jitterAngle,
      });
      if (Math.random() < br.secondaryBrushProb) {
        const accentT = (colorT + 0.5) % 1;
        const accentCol = sampleGradient(d.colorStops, accentT);
        callBrush(ctx, br.secondaryBrush || 'hairLine', path, {
          color: accentCol, weight: rand(0.5, 1.0),
          opacity: 0.75, blend: false,
        });
      }
    }
  }

  function drawColorCurve() {
    const archetype = choice(['arc', 's-curve', 'horizontal-wave', 'diagonal-drift']);
    const m = Math.min(canvasW, canvasH) * 0.10;
    let path;
    switch (archetype) {
      case 'arc': {
        const side = Math.random() < 0.5;
        const x0 = side ? m : canvasW - m;
        const x1 = side ? canvasW - m : m;
        const y0 = rand(canvasH * 0.2, canvasH * 0.8);
        const y1 = rand(canvasH * 0.2, canvasH * 0.8);
        const yMid = (y0 + y1) / 2 + rand(-canvasH * 0.25, canvasH * 0.25);
        path = [
          { x: x0, y: y0 },
          { x: canvasW * 0.35, y: yMid + rand(-30, 30) },
          { x: canvasW * 0.65, y: yMid + rand(-30, 30) },
          { x: x1, y: y1 },
        ];
        break;
      }
      case 's-curve': {
        const x0 = rand(canvasW * 0.1, canvasW * 0.3);
        const x1 = rand(canvasW * 0.7, canvasW * 0.9);
        path = [
          { x: x0, y: m + rand(0, canvasH * 0.2) },
          { x: rand(canvasW * 0.25, canvasW * 0.45), y: canvasH * 0.35 + rand(-30, 30) },
          { x: rand(canvasW * 0.55, canvasW * 0.75), y: canvasH * 0.65 + rand(-30, 30) },
          { x: x1, y: canvasH - m - rand(0, canvasH * 0.2) },
        ];
        break;
      }
      case 'horizontal-wave': {
        const y = rand(canvasH * 0.25, canvasH * 0.75);
        const amp = rand(20, 70);
        path = [
          { x: m, y },
          { x: canvasW * 0.3, y: y + amp * choice([-1, 1]) },
          { x: canvasW * 0.5, y: y + amp * choice([-1, 1]) },
          { x: canvasW * 0.7, y: y + amp * choice([-1, 1]) },
          { x: canvasW - m, y },
        ];
        break;
      }
      case 'diagonal-drift': {
        const x0 = rand(m, canvasW * 0.3);
        const y0 = rand(m, canvasH * 0.3);
        const x1 = rand(canvasW * 0.7, canvasW - m);
        const y1 = rand(canvasH * 0.7, canvasH - m);
        path = [
          { x: x0, y: y0 },
          { x: x0 + (x1 - x0) * 0.4 + rand(-50, 50), y: y0 + (y1 - y0) * 0.4 + rand(-50, 50) },
          { x: x0 + (x1 - x0) * 0.7 + rand(-50, 50), y: y0 + (y1 - y0) * 0.7 + rand(-50, 50) },
          { x: x1, y: y1 },
        ];
        break;
      }
    }
    const stops = [];
    const stopN = randI(2, 3);
    const used = new Set();
    while (stops.length < stopN && used.size < palette.colors.length) {
      const i = randI(0, palette.colors.length - 1);
      if (!used.has(i)) { used.add(i); stops.push(palette.colors[i]); }
    }
    const segments = 8;
    const baseWeight = rand(4, 8);
    for (let i = 0; i < segments; i++) {
      const t0 = i / segments, t1 = (i + 1) / segments;
      const sub = [];
      const subSamples = 4;
      for (let j = 0; j <= subSamples; j++) {
        const t = t0 + (t1 - t0) * (j / subSamples);
        sub.push(catmullRom(path, t));
      }
      const col = sampleGradient(stops, (t0 + t1) / 2);
      const segPressure = Math.sin(((t0 + t1) / 2) * Math.PI);
      const segWeight = baseWeight * (0.35 + 0.65 * segPressure) * rand(0.85, 1.15);
      fatLozenge(ctx, sub, {
        color: col, weight: segWeight,
        opacity: rand(0.55, 0.78), blend: true, jitterAngle: 3,
      });
    }
    if (Math.random() < 0.6) {
      const dabs = randI(4, 10);
      for (let i = 0; i < dabs; i++) {
        const t = Math.random();
        const p = catmullRom(path, t);
        const tan = tangent(path, t);
        const dabPath = [
          { x: p.x - Math.cos(tan) * 8, y: p.y - Math.sin(tan) * 8 },
          { x: p.x + Math.cos(tan) * 8, y: p.y + Math.sin(tan) * 8 },
        ];
        chalkScribble(ctx, dabPath, {
          color: sampleGradient(stops, t),
          weight: rand(1.5, 2.5), opacity: 0.7, blend: true,
        });
      }
    }
  }

  function drawBgWash() {
    const col = choice(palette.colors);
    const cx = rand(canvasW * 0.1, canvasW * 0.9);
    const cy = rand(canvasH * 0.1, canvasH * 0.9);
    const sizeRoll = Math.random();
    const sz = sizeRoll < 0.3 ? rand(60, 130) : sizeRoll < 0.8 ? rand(130, 230) : rand(230, 320);
    const w = sz * rand(0.8, 1.2);
    const h = sz * rand(0.8, 1.2);
    watercolorWash(ctx, {
      type: choice(['blob', 'blob', 'ellipse', 'rect']),
      cx, cy, w, h,
    }, {
      color: col, opacity: rand(0.22, 0.48), bleed: rand(0.30, 0.55),
    });
  }

  function drawCrossMarks(count) {
    for (let i = 0; i < count; i++) {
      registrationCross(ctx,
        rand(canvasW * 0.05, canvasW * 0.95),
        rand(canvasH * 0.05, canvasH * 0.95),
        {
          color: '#2a2a2a', size: rand(3.5, 7), weight: rand(0.5, 1.1),
          rotation: rand(-0.1, 0.1), opacity: rand(0.55, 0.85),
        });
    }
  }

  function drawDashedFrame() {
    const m = Math.min(canvasW, canvasH) * 0.04;
    B.dashedPerimeter(ctx, {
      type: 'rect', cx: canvasW / 2, cy: canvasH / 2,
      w: canvasW - 2 * m, h: canvasH - 2 * m,
    }, { color: '#3a3a3a', dashLen: 5, gapLen: 4, weight: 0.8, opacity: 0.6 });
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Main render
  // ──────────────────────────────────────────────────────────────────────────
  function render() {
    const t0 = performance.now();
    setStatus('rendering…', 'warn');
    ctx.fillStyle = palette.bg;
    ctx.fillRect(0, 0, canvasW, canvasH);

    const br = activeBrush;
    const baseCount = { sparse: 3, medium: 5, dense: 8 }[density];
    const doodleCount = baseCount + randI(0, 2);

    if (opts.bgWash) {
      const n = { sparse: 3, medium: 5, dense: 8 }[density];
      for (let i = 0; i < n; i++) drawBgWash();
    }

    const doodles = generateDoodles(doodleCount, br);
    for (const d of doodles) drawDoodle(d, br);

    if (opts.colorCurves) {
      const n = { sparse: 1, medium: 2, dense: 4 }[density];
      for (let i = 0; i < n; i++) drawColorCurve();
    }
    if (opts.crossMarks) {
      const n = { sparse: 6, medium: 14, dense: 26 }[density];
      drawCrossMarks(n);
    }
    if (opts.dashedFrame) drawDashedFrame();

    const dt = (performance.now() - t0).toFixed(0);
    setStatus(`${doodleCount} doodles · ${dt}ms · ${palette.name}`);
  }

  function setStatus(text, level) {
    const el = document.getElementById('status');
    el.textContent = text;
    el.className = 'status ' + (level || '');
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Brush ↔ sliders binding
  // ──────────────────────────────────────────────────────────────────────────
  // The sliders are bound to fields of `activeBrush`. Changing a slider
  // mutates activeBrush and re-renders. activeBrush starts as a deep clone
  // of the selected built-in / saved brush; saving captures it under a
  // user-chosen name.

  const SLIDER_BINDINGS = [
    { id: 'starburstProb',       get: b => b.starburstProb,       set: (b, v) => b.starburstProb = v,       fmt: v => v.toFixed(2) },
    { id: 'underWashProb',       get: b => b.underWashProb,       set: (b, v) => b.underWashProb = v,       fmt: v => v.toFixed(2) },
    { id: 'underWashOpacity',    get: b => b.underWashOpacity,    set: (b, v) => b.underWashOpacity = v,    fmt: v => v.toFixed(2) },
    { id: 'underWashBleed',      get: b => b.underWashBleed,      set: (b, v) => b.underWashBleed = v,      fmt: v => v.toFixed(2) },
    { id: 'cycleRate',           get: b => b.cycleRate,           set: (b, v) => b.cycleRate = v,           fmt: v => v.toFixed(1) },
    { id: 'colorJitter',         get: b => b.colorJitter,         set: (b, v) => b.colorJitter = v,         fmt: v => v.toFixed(3) },
    { id: 'mixFat',              get: b => b.brushMix.fatLozenge,        set: (b, v) => b.brushMix.fatLozenge = v,        fmt: v => v.toFixed(0) + '%' },
    { id: 'mixChalkDrag',        get: b => b.brushMix.chalkDrag,         set: (b, v) => b.brushMix.chalkDrag = v,         fmt: v => v.toFixed(0) + '%' },
    { id: 'mixHair',             get: b => b.brushMix.hairLine,          set: (b, v) => b.brushMix.hairLine = v,          fmt: v => v.toFixed(0) + '%' },
    { id: 'mixChalkScribble',    get: b => b.brushMix.chalkScribble,     set: (b, v) => b.brushMix.chalkScribble = v,     fmt: v => v.toFixed(0) + '%' },
  ];

  function refreshSliders() {
    for (const b of SLIDER_BINDINGS) {
      const el = document.getElementById(b.id);
      const disp = document.querySelector(`[data-display="${b.id}"]`);
      const val = b.get(activeBrush);
      if (el) el.value = val;
      if (disp) disp.textContent = b.fmt(val);
    }
  }

  function bindSliders() {
    for (const b of SLIDER_BINDINGS) {
      const el = document.getElementById(b.id);
      const disp = document.querySelector(`[data-display="${b.id}"]`);
      if (!el) continue;
      // 'input' for live display, 'change' for regen (fires on release)
      el.addEventListener('input', () => {
        const v = parseFloat(el.value);
        if (disp) disp.textContent = b.fmt(v);
        b.set(activeBrush, v);
      });
      el.addEventListener('change', render);
    }
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Brush dropdown population + selection
  // ──────────────────────────────────────────────────────────────────────────
  function refreshBrushDropdown() {
    const sel = document.getElementById('brushSel');
    sel.innerHTML = '';
    // Built-ins first
    for (const name of Object.keys(BUILT_IN_BRUSHES)) {
      const o = document.createElement('option'); o.value = name; o.textContent = name; sel.appendChild(o);
    }
    const customs = loadCustomBrushes();
    const customNames = Object.keys(customs);
    if (customNames.length) {
      const sep = document.createElement('option');
      sep.disabled = true; sep.textContent = '─── saved ───';
      sel.appendChild(sep);
      for (const name of customNames) {
        const o = document.createElement('option'); o.value = name; o.textContent = '★ ' + name; sel.appendChild(o);
      }
    }
    sel.value = brushName;
  }

  function selectBrush(name) {
    const all = getAllBrushes();
    if (!all[name]) return;
    brushName = name;
    activeBrush = cloneBrush(all[name]);
    refreshSliders();
    render();
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Boot
  // ──────────────────────────────────────────────────────────────────────────
  function boot() {
    if (typeof spectral === 'undefined' || !window.B) {
      setStatus('waiting for deps…', 'warn');
      setTimeout(boot, 60);
      return;
    }
    canvas = document.getElementById('main');
    ctx = canvas.getContext('2d');
    sizeCanvas();

    // Palette dropdown
    const palSel = document.getElementById('paletteSel');
    PALETTES.forEach((p, i) => {
      const o = document.createElement('option'); o.value = i; o.textContent = p.name; palSel.appendChild(o);
    });
    palSel.addEventListener('change', e => { palette = PALETTES[parseInt(e.target.value)]; render(); });

    // Brush dropdown
    refreshBrushDropdown();
    document.getElementById('brushSel').addEventListener('change', e => selectBrush(e.target.value));

    // Density + toggles
    document.getElementById('densitySel').addEventListener('change', e => { density = e.target.value; render(); });
    ['bgWash', 'crossMarks', 'colorCurves', 'dashedFrame'].forEach(id => {
      document.getElementById(id).addEventListener('change', e => { opts[id] = e.target.checked; render(); });
    });

    // Sliders
    bindSliders();
    refreshSliders();

    // Save as new brush
    document.getElementById('saveAsBtn').addEventListener('click', () => {
      const name = prompt('Save current scene settings as…\n(includes ALL slider values)', 'My scene');
      if (!name || !name.trim()) return;
      const customs = loadCustomBrushes();
      customs[name.trim()] = cloneBrush(activeBrush);
      saveCustomBrushes(customs);
      brushName = name.trim();
      refreshBrushDropdown();
      setStatus(`saved "${brushName}"`);
    });

    // Delete current custom brush
    document.getElementById('deleteBtn').addEventListener('click', () => {
      const customs = loadCustomBrushes();
      if (!customs[brushName]) {
        setStatus('can\'t delete a built-in scene', 'fail');
        return;
      }
      if (!confirm(`Delete custom scene "${brushName}"?`)) return;
      delete customs[brushName];
      saveCustomBrushes(customs);
      selectBrush('Soft & dreamy');
      refreshBrushDropdown();
      setStatus(`deleted custom scene`);
    });

    // Actions
    document.getElementById('newBtn').addEventListener('click', render);
    document.getElementById('saveBtn').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `brushstroke-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
    canvas.addEventListener('dblclick', render);
    window.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'r' || e.key === 'R') render();
      if (e.key === 's' || e.key === 'S') document.getElementById('saveBtn').click();
    });

    // Debounced resize
    let resizeTO = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTO);
      resizeTO = setTimeout(() => { sizeCanvas(); render(); }, 200);
    });

    setTimeout(render, 30);
  }
  boot();
  </script>
</body>
</html>
