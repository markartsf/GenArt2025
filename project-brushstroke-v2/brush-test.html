<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Brushstroke v2 — Brush Test (Phase 2)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #1a1a1a;
      color: #ddd;
      font-family: 'SF Mono', Menlo, monospace;
      font-size: 12px;
    }
    #container {
      min-height: 100vh;
    }
    #controls {
      padding: 10px 16px;
      background: rgba(20,20,20,0.95);
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    #title {
      font-size: 12px;
      letter-spacing: 2px;
      color: #a9c1ff;
      text-transform: uppercase;
      margin-right: 4px;
    }
    button {
      background: #2a2a2a;
      color: #ddd;
      border: 1px solid #444;
      padding: 5px 12px;
      border-radius: 3px;
      cursor: pointer;
      font: inherit;
      font-size: 11px;
    }
    button:hover { background: #353535; }
    select {
      background: #2a2a2a; color: #ddd; border: 1px solid #444;
      padding: 4px 10px; border-radius: 3px; font: inherit; font-size: 11px;
    }
    #status {
      color: #888;
      font-size: 11px;
      margin-left: auto;
    }
    #status.pass { color: #9fd1a0; }
    #status.fail { color: #ff9a9a; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 12px;
      padding: 16px;
    }
    .cell {
      background: #0d0d0d;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      overflow: hidden;
    }
    .cell h2 {
      font-size: 11px;
      letter-spacing: 0.12em;
      color: #9fd1a0;
      padding: 8px 12px;
      text-transform: uppercase;
      border-bottom: 1px solid #1d1d1d;
      background: #131313;
    }
    .cell canvas {
      display: block;
      background: #fffceb;
      width: 100%;
      height: auto;
    }
    .cell .meta {
      padding: 6px 12px;
      color: #666;
      font-size: 10px;
      border-top: 1px solid #1d1d1d;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="controls">
      <span id="title">project brushstroke v2 — brush test</span>
      <button id="regenBtn">↻ Regenerate all</button>
      <label style="color:#888;">Palette:
        <select id="paletteSel"></select>
      </label>
      <span id="status">loading…</span>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/spectral.js"></script>
  <script>
  // ──────────────────────────────────────────────────────────────────────────
  // Alejandro's 8 palettes
  // ──────────────────────────────────────────────────────────────────────────
  const PALETTES = [
    { name: 'Blanc Ivoire',        bg: '#fffceb', colors: ['#2c695a','#4ad6af','#7facc6','#4e93cc','#f6684f','#ffd300'] },
    { name: 'Outremer Gris',       bg: '#e2e7dc', colors: ['#7b4800','#002185','#003c32','#fcd300','#ff2702','#6b9404'] },
    { name: 'Gris Clair',          bg: '#ccccc6', colors: ['#474238','#f4bd48','#9c2128','#395a8e','#7facc6','#2c695a'] },
    { name: 'Le Rubis',            bg: '#ffe6d4', colors: ['#6c2b3b','#c76282','#445e87','#003c32','#e0b411','#c8491b'] },
    { name: 'Playgrounds',         bg: '#c49a70', colors: ['#4e0042','#002185','#076d16','#feec00','#ff6900','#ff2702'] },
    { name: 'Bleu Outremer',       bg: '#4e6498', colors: ['#cdd3e3','#c6353c','#f6684f','#fcd300','#488b6d','#7fb4b5'] },
    { name: 'Bleu Outremer Foncé', bg: '#0e2d58', colors: ['#f4f4f4','#c8c9ca','#939598','#616568','#0e1318','#080f15'] },
    { name: "Noir d'Ivoire",       bg: '#080f15', colors: ['#C8C1B7','#d7d7d7','#b0b0b0','#8b8b8b','#676767','#464646'] },
  ];
  let palette = PALETTES[0];

  // ──────────────────────────────────────────────────────────────────────────
  // Helpers
  // ──────────────────────────────────────────────────────────────────────────
  const rand   = (a, b) => a + Math.random() * (b - a);
  const randI  = (a, b) => Math.floor(rand(a, b + 1));
  const choice = arr   => arr[Math.floor(Math.random() * arr.length)];

  // Catmull-Rom spline sample. pts: [{x,y},...], t in [0,1] → {x,y}
  function catmullRom(pts, t) {
    if (pts.length < 2) return { ...pts[0] };
    if (pts.length === 2) {
      return {
        x: pts[0].x + (pts[1].x - pts[0].x) * t,
        y: pts[0].y + (pts[1].y - pts[0].y) * t,
      };
    }
    const n = pts.length - 1;
    const seg = Math.min(n - 1, Math.floor(t * n));
    const localT = t * n - seg;
    const p0 = pts[Math.max(0, seg - 1)];
    const p1 = pts[seg];
    const p2 = pts[seg + 1];
    const p3 = pts[Math.min(pts.length - 1, seg + 2)];
    const t2 = localT * localT;
    const t3 = t2 * localT;
    const x = 0.5 * ((2 * p1.x) +
      (-p0.x + p2.x) * localT +
      (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
      (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3);
    const y = 0.5 * ((2 * p1.y) +
      (-p0.y + p2.y) * localT +
      (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
      (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3);
    return { x, y };
  }

  // Path length, sampled
  function pathLength(pts, samples = 60) {
    let len = 0, prev = catmullRom(pts, 0);
    for (let i = 1; i <= samples; i++) {
      const p = catmullRom(pts, i / samples);
      len += Math.hypot(p.x - prev.x, p.y - prev.y);
      prev = p;
    }
    return len;
  }

  // Tangent at t via finite difference
  function tangent(pts, t) {
    const eps = 0.003;
    const a = catmullRom(pts, Math.max(0, t - eps));
    const b = catmullRom(pts, Math.min(1, t + eps));
    return Math.atan2(b.y - a.y, b.x - a.x);
  }

  // Bell pressure curve (peak in middle, taper at ends)
  function bellPressure(t, min = 0.7, max = 1.0) {
    return min + (max - min) * Math.sin(t * Math.PI);
  }

  // Hex ↔ rgb
  function hexToRgb(hex) {
    const h = hex.replace('#', '');
    return {
      r: parseInt(h.slice(0, 2), 16),
      g: parseInt(h.slice(2, 4), 16),
      b: parseInt(h.slice(4, 6), 16),
    };
  }
  function rgbToHex(r, g, b) {
    const c = v => Math.round(v).toString(16).padStart(2, '0');
    return '#' + c(r) + c(g) + c(b);
  }

  // Spectral mix (v3 API only; v2 fallback omitted now since CDN serves v3)
  function mixHex(a, b, t) {
    const c1 = new spectral.Color(a);
    const c2 = new spectral.Color(b);
    const result = spectral.mix([c1, 1 - t], [c2, t]);
    return result.toString();
  }

  // Sample canvas pixel at (x,y) as hex. Returns null if out of bounds.
  function samplePixelHex(ctx, x, y) {
    const w = ctx.canvas.width, h = ctx.canvas.height;
    x = Math.max(0, Math.min(w - 1, Math.round(x)));
    y = Math.max(0, Math.min(h - 1, Math.round(y)));
    const d = ctx.getImageData(x, y, 1, 1).data;
    return rgbToHex(d[0], d[1], d[2]);
  }

  // Apply spectral blend if blend:true. Returns colour to paint.
  function blendedColor(ctx, x, y, color, blend, ratio = 0.55) {
    if (!blend) return color;
    try {
      const bg = samplePixelHex(ctx, x, y);
      return mixHex(bg, color, ratio);
    } catch (e) {
      return color;
    }
  }

  // ──────────────────────────────────────────────────────────────────────────
  // BRUSHES (8 single-stroke primitives)
  // ──────────────────────────────────────────────────────────────────────────

  // 1. HAIR LINE — thin smooth line, ~1–2px, slight pressure variation
  function hairLine(ctx, path, { color, weight = 1, opacity = 0.85, blend = false }) {
    const len = pathLength(path);
    const steps = Math.max(8, Math.floor(len * 0.6));
    ctx.lineCap = 'round';
    let prev = catmullRom(path, 0);
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      const p = catmullRom(path, t);
      const w = weight * bellPressure(t, 0.85, 1.0);
      const col = blendedColor(ctx, p.x, p.y, color, blend, 0.5);
      ctx.strokeStyle = col;
      ctx.lineWidth = w;
      ctx.globalAlpha = opacity * (0.85 + 0.15 * Math.random());
      ctx.beginPath();
      ctx.moveTo(prev.x, prev.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      prev = p;
    }
    ctx.globalAlpha = 1;
  }

  // 2. FAT LOZENGE — short thick stroke, rectangular tip stamped along path
  function fatLozenge(ctx, path, { color, weight = 6, opacity = 0.75, blend = true, jitterAngle = 4 }) {
    const len = pathLength(path);
    const spacing = weight * 0.25;
    const steps = Math.max(4, Math.floor(len / spacing));
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const p = catmullRom(path, t);
      const ang = tangent(path, t) + rand(-jitterAngle, jitterAngle) * Math.PI / 180;
      const pressure = bellPressure(t, 0.55, 1.0);
      const w = weight * pressure;
      const col = blendedColor(ctx, p.x, p.y, color, blend, 0.5);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(ang);
      ctx.fillStyle = col;
      ctx.globalAlpha = opacity;
      // rounded rectangle — long axis along path direction
      const half = w / 2;
      const len2 = w * 0.7;
      ctx.beginPath();
      ctx.ellipse(0, 0, len2, half * 0.7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // 3. CHALK DRAG — long granular path with broken-pigment texture
  function chalkDrag(ctx, path, { color, weight = 3, opacity = 0.55, blend = true, density = 1 }) {
    const len = pathLength(path);
    const spacing = weight * 0.5;
    const steps = Math.max(8, Math.floor(len / spacing * density));
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      // Skip ~15% of stamps for gappy feel
      if (Math.random() < 0.15) continue;
      const p = catmullRom(path, t);
      const ang = tangent(path, t);
      const w = weight * rand(0.7, 1.1);
      const col = blendedColor(ctx, p.x, p.y, color, blend, 0.45);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(ang);
      ctx.fillStyle = col;
      ctx.globalAlpha = opacity * rand(0.7, 1.1);
      // Tiny cluster of dots aligned with path
      const cluster = 3 + randI(0, 2);
      for (let j = 0; j < cluster; j++) {
        const ox = rand(-w * 1.2, w * 1.2);
        const oy = rand(-w * 0.4, w * 0.4);
        const dx = rand(w * 0.5, w * 0.9);
        const dy = rand(w * 0.2, w * 0.4);
        ctx.beginPath();
        ctx.ellipse(ox, oy, dx, dy, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // 4. CHALK SCRIBBLE — short fragmented dashes; like chalk_drag but more broken
  function chalkScribble(ctx, path, { color, weight = 2.5, opacity = 0.65, blend = true, breakProb = 0.35 }) {
    const len = pathLength(path);
    const spacing = weight * 0.6;
    const steps = Math.max(6, Math.floor(len / spacing));
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      if (Math.random() < breakProb) continue;
      const p = catmullRom(path, t);
      const ang = tangent(path, t) + rand(-15, 15) * Math.PI / 180;
      const w = weight * rand(0.6, 1.2);
      const col = blendedColor(ctx, p.x, p.y, color, blend, 0.5);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(ang);
      ctx.fillStyle = col;
      ctx.globalAlpha = opacity * rand(0.7, 1.0);
      // Smaller, tighter cluster than chalk_drag
      for (let j = 0; j < 2; j++) {
        const ox = rand(-w * 0.6, w * 0.6);
        const oy = rand(-w * 0.3, w * 0.3);
        ctx.beginPath();
        ctx.ellipse(ox, oy, w * 0.7, w * 0.35, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // 5. SPRAY FIELD — fine dotted spatter at low density around a centre
  function sprayField(ctx, cx, cy, { color, radius = 50, density = 80, opacity = 0.45, falloff = 1.0 }) {
    ctx.fillStyle = color;
    for (let i = 0; i < density; i++) {
      // Distance with falloff bias toward centre
      const r = radius * Math.pow(Math.random(), falloff);
      const a = Math.random() * Math.PI * 2;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      const sz = rand(0.4, 1.6);
      ctx.globalAlpha = opacity * rand(0.5, 1.0);
      ctx.beginPath();
      ctx.arc(x, y, sz, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // 6. WATERCOLOUR WASH — large soft translucent region with ragged edges
  function watercolorWash(ctx, shape, { color, opacity = 0.35, bleed = 0.4 }) {
    // shape: { type: 'ellipse'|'rect', cx, cy, w, h }
    const passes = 3 + randI(0, 2);
    for (let i = 0; i < passes; i++) {
      const passAlpha = opacity * (i === 0 ? 1.0 : (0.25 + 0.15 * Math.random()));
      const ox = i === 0 ? 0 : rand(-shape.w * bleed * 0.25, shape.w * bleed * 0.25);
      const oy = i === 0 ? 0 : rand(-shape.h * bleed * 0.25, shape.h * bleed * 0.25);
      const sw = shape.w * (i === 0 ? 1 : rand(0.7, 1.1));
      const sh = shape.h * (i === 0 ? 1 : rand(0.7, 1.1));
      ctx.fillStyle = color;
      ctx.globalAlpha = passAlpha;
      if (shape.type === 'rect') {
        ctx.fillRect(shape.cx - sw / 2 + ox, shape.cy - sh / 2 + oy, sw, sh);
      } else {
        ctx.beginPath();
        ctx.ellipse(shape.cx + ox, shape.cy + oy, sw / 2, sh / 2, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // Ragged edge: scatter small low-alpha dots just inside the perimeter
    const edgeDots = 28 + randI(0, 12);
    ctx.fillStyle = color;
    for (let i = 0; i < edgeDots; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = bleed * Math.max(shape.w, shape.h) * 0.5;
      const x = shape.cx + Math.cos(a) * (shape.w / 2 + rand(-r * 0.2, r * 0.4));
      const y = shape.cy + Math.sin(a) * (shape.h / 2 + rand(-r * 0.2, r * 0.4));
      ctx.globalAlpha = opacity * rand(0.15, 0.45);
      ctx.beginPath();
      ctx.arc(x, y, rand(0.6, 1.8), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // 7. REGISTRATION CROSS — small "+" stamp
  function registrationCross(ctx, x, y, { color = '#2a2a2a', size = 6, weight = 1, rotation = 0, opacity = 0.85 }) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);
    ctx.strokeStyle = color;
    ctx.lineWidth = weight;
    ctx.lineCap = 'round';
    ctx.globalAlpha = opacity;
    ctx.beginPath();
    ctx.moveTo(-size, 0); ctx.lineTo(size, 0);
    ctx.moveTo(0, -size); ctx.lineTo(0, size);
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // 8. GESTURAL SWEEP — long flowing smooth stroke, stronger taper than fat_lozenge
  function gesturalSweep(ctx, path, { color, weight = 5, opacity = 0.65, blend = true }) {
    const len = pathLength(path);
    const spacing = weight * 0.2;
    const steps = Math.max(12, Math.floor(len / spacing));
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const p = catmullRom(path, t);
      const ang = tangent(path, t);
      // Stronger taper than fat_lozenge — cosine-like rise/fall
      const pressure = 0.15 + 0.85 * Math.pow(Math.sin(t * Math.PI), 1.6);
      const w = weight * pressure;
      const col = blendedColor(ctx, p.x, p.y, color, blend, 0.4);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(ang);
      ctx.fillStyle = col;
      ctx.globalAlpha = opacity;
      ctx.beginPath();
      ctx.ellipse(0, 0, w * 0.9, w * 0.42, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Sample paths used by stroke brushes in the test
  // ──────────────────────────────────────────────────────────────────────────
  function arcPath(cw, ch, marginX = 30, marginY = 30) {
    return [
      { x: marginX, y: ch * 0.6 },
      { x: cw * 0.33, y: ch * 0.3 },
      { x: cw * 0.66, y: ch * 0.3 },
      { x: cw - marginX, y: ch * 0.6 },
    ];
  }
  function sCurvePath(cw, ch, marginX = 30) {
    return [
      { x: marginX, y: ch * 0.25 },
      { x: cw * 0.35, y: ch * 0.55 },
      { x: cw * 0.65, y: ch * 0.45 },
      { x: cw - marginX, y: ch * 0.75 },
    ];
  }
  function shortPath(cw, ch, ox, oy, lengthFrac, angle) {
    const cx = cw / 2 + ox;
    const cy = ch / 2 + oy;
    const len = Math.min(cw, ch) * lengthFrac;
    const dx = Math.cos(angle) * len / 2;
    const dy = Math.sin(angle) * len / 2;
    return [
      { x: cx - dx, y: cy - dy },
      { x: cx - dx * 0.5, y: cy - dy * 0.5 + rand(-4, 4) },
      { x: cx + dx * 0.5, y: cy + dy * 0.5 + rand(-4, 4) },
      { x: cx + dx, y: cy + dy },
    ];
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Per-brush demo renderers — each draws ~5-10 samples to show variety
  // ──────────────────────────────────────────────────────────────────────────
  const CW = 340, CH = 220;

  function paintBackground(ctx) {
    ctx.fillStyle = palette.bg;
    ctx.fillRect(0, 0, CW, CH);
  }

  const DEMOS = [
    {
      name: 'hair_line',
      sub: 'thin smooth line · 1–2px',
      draw(ctx) {
        paintBackground(ctx);
        for (let i = 0; i < 7; i++) {
          const col = choice(palette.colors);
          const p = i % 2 === 0 ? arcPath(CW, CH, 20 + i*4, 20) : sCurvePath(CW, CH, 20 + i*6);
          hairLine(ctx, p, { color: col, weight: rand(0.6, 1.6), opacity: rand(0.4, 0.9) });
        }
      },
    },
    {
      name: 'fat_lozenge',
      sub: 'rect-ish tip · stamped along path',
      draw(ctx) {
        paintBackground(ctx);
        // 8 short strokes radiating from a centre point
        const cx = CW / 2, cy = CH / 2;
        for (let i = 0; i < 9; i++) {
          const a = (i / 9) * Math.PI * 2 + rand(-0.1, 0.1);
          const r = rand(35, 80);
          const p = [
            { x: cx + Math.cos(a) * 12, y: cy + Math.sin(a) * 12 },
            { x: cx + Math.cos(a) * (r * 0.5), y: cy + Math.sin(a) * (r * 0.5) },
            { x: cx + Math.cos(a) * (r * 0.8), y: cy + Math.sin(a) * (r * 0.8) },
            { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r },
          ];
          fatLozenge(ctx, p, { color: choice(palette.colors), weight: rand(4, 9), opacity: rand(0.6, 0.85), blend: true });
        }
      },
    },
    {
      name: 'chalk_drag',
      sub: 'long granular · broken pigment',
      draw(ctx) {
        paintBackground(ctx);
        for (let i = 0; i < 5; i++) {
          const p = i % 2 === 0 ? arcPath(CW, CH, 18, 18 + i * 6) : sCurvePath(CW, CH, 22 + i * 4);
          chalkDrag(ctx, p, { color: choice(palette.colors), weight: rand(2.5, 4), opacity: rand(0.4, 0.65), blend: true, density: rand(0.7, 1.1) });
        }
      },
    },
    {
      name: 'chalk_scribble',
      sub: 'short fragmented dashes',
      draw(ctx) {
        paintBackground(ctx);
        for (let i = 0; i < 14; i++) {
          const ox = rand(-CW * 0.35, CW * 0.35);
          const oy = rand(-CH * 0.30, CH * 0.30);
          const ang = rand(0, Math.PI * 2);
          const p = shortPath(CW, CH, ox, oy, rand(0.10, 0.25), ang);
          chalkScribble(ctx, p, { color: choice(palette.colors), weight: rand(1.5, 3), opacity: rand(0.5, 0.85), blend: true });
        }
      },
    },
    {
      name: 'spray_field',
      sub: 'scattered dots · falloff',
      draw(ctx) {
        paintBackground(ctx);
        for (let i = 0; i < 5; i++) {
          const cx = rand(40, CW - 40), cy = rand(40, CH - 40);
          sprayField(ctx, cx, cy, {
            color: choice(palette.colors),
            radius: rand(30, 60),
            density: randI(50, 140),
            opacity: rand(0.3, 0.55),
            falloff: rand(0.7, 1.8),
          });
        }
      },
    },
    {
      name: 'watercolor_wash',
      sub: 'translucent · ragged edge',
      draw(ctx) {
        paintBackground(ctx);
        for (let i = 0; i < 4; i++) {
          watercolorWash(ctx, {
            type: choice(['ellipse','ellipse','rect']),
            cx: rand(60, CW - 60),
            cy: rand(50, CH - 50),
            w: rand(70, 130),
            h: rand(60, 110),
          }, { color: choice(palette.colors), opacity: rand(0.25, 0.45), bleed: rand(0.3, 0.55) });
        }
      },
    },
    {
      name: 'registration_cross',
      sub: 'small "+" stamp',
      draw(ctx) {
        paintBackground(ctx);
        // Light wash background for context
        watercolorWash(ctx, { type: 'ellipse', cx: CW / 2, cy: CH / 2, w: CW * 0.7, h: CH * 0.7 },
          { color: palette.colors[0], opacity: 0.15, bleed: 0.4 });
        for (let i = 0; i < 16; i++) {
          registrationCross(ctx, rand(20, CW - 20), rand(20, CH - 20), {
            color: '#2a2a2a',
            size: rand(4, 8),
            weight: rand(0.6, 1.2),
            rotation: rand(-0.1, 0.1),
            opacity: rand(0.6, 0.9),
          });
        }
      },
    },
    {
      name: 'gestural_sweep',
      sub: 'long flowing · strong taper',
      draw(ctx) {
        paintBackground(ctx);
        for (let i = 0; i < 4; i++) {
          const p = i % 2 === 0 ? arcPath(CW, CH, 20, 30 + i * 8) : sCurvePath(CW, CH, 25 + i * 6);
          gesturalSweep(ctx, p, { color: choice(palette.colors), weight: rand(4, 8), opacity: rand(0.5, 0.75), blend: true });
        }
      },
    },
  ];

  // ──────────────────────────────────────────────────────────────────────────
  // Build the grid + render
  // ──────────────────────────────────────────────────────────────────────────
  const grid = document.getElementById('grid');
  const statusEl = document.getElementById('status');
  const palSel = document.getElementById('paletteSel');

  PALETTES.forEach((p, i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = p.name; palSel.appendChild(o);
  });
  palSel.addEventListener('change', e => {
    palette = PALETTES[parseInt(e.target.value)];
    renderAll();
  });

  function buildGrid() {
    grid.innerHTML = '';
    for (const demo of DEMOS) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.innerHTML = `<h2>${demo.name}</h2>`;
      const c = document.createElement('canvas');
      c.width = CW; c.height = CH;
      cell.appendChild(c);
      const meta = document.createElement('div');
      meta.className = 'meta'; meta.textContent = demo.sub;
      cell.appendChild(meta);
      grid.appendChild(cell);
      demo.canvas = c;
    }
  }

  function renderAll() {
    for (const demo of DEMOS) {
      const ctx = demo.canvas.getContext('2d');
      try { demo.draw(ctx); }
      catch (e) {
        ctx.fillStyle = '#330'; ctx.fillRect(0, 0, CW, CH);
        ctx.fillStyle = '#ff9a9a'; ctx.font = '11px monospace'; ctx.fillText('ERR: ' + e.message, 10, 20);
        console.error(demo.name, e);
      }
    }
    statusEl.textContent = `rendered ${DEMOS.length} brushes · palette: ${palette.name}`;
    statusEl.className = 'pass';
  }

  document.getElementById('regenBtn').addEventListener('click', renderAll);

  // Wait for spectral.js then render
  function go() {
    if (typeof spectral === 'undefined') { setTimeout(go, 60); return; }
    buildGrid();
    renderAll();
  }
  go();
  </script>
</body>
</html>
