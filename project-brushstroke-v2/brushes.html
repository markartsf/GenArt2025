<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Brushstroke v2 — Brushes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #1a1a1a;
      color: #ddd;
      font-family: 'SF Mono', Menlo, monospace;
      font-size: 11px;
      overflow: hidden;
    }
    #container { display: flex; height: 100vh; }

    #sidebar {
      width: 270px;
      flex-shrink: 0;
      background: #121212;
      border-right: 1px solid #2a2a2a;
      overflow-y: auto;
      padding: 12px 14px;
    }
    #sidebar h1 {
      font-size: 11px;
      letter-spacing: 0.15em;
      color: #a9c1ff;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    #sidebar .subtitle { color: #666; font-size: 10px; margin-bottom: 10px; }
    #sidebar .group {
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1f1f1f;
    }
    #sidebar .group:last-child { border-bottom: none; }
    #sidebar .group-title {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: #9fd1a0;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    #sidebar label.block {
      display: block;
      margin-bottom: 8px;
      color: #888;
    }
    #sidebar label.block > span.l {
      display: inline-block;
      width: 100%;
      color: #aaa;
      margin-bottom: 3px;
      font-size: 10px;
    }
    #sidebar label.block > span.l > span.v {
      float: right;
      color: #6da9ff;
    }
    #sidebar label.flex {
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 6px; color: #888;
      cursor: pointer;
    }
    #sidebar input[type=range] {
      width: 100%;
      accent-color: #6da9ff;
    }
    #sidebar button, #sidebar select {
      width: 100%;
      background: #232323;
      color: #ddd;
      border: 1px solid #3a3a3a;
      padding: 5px 8px;
      border-radius: 3px;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
      margin-bottom: 4px;
    }
    #sidebar button:hover, #sidebar select:hover { background: #2c2c2c; }
    #sidebar button.primary { background: #2a3a5a; border-color: #3a4a6a; }
    #sidebar button.primary:hover { background: #344a72; }
    #sidebar .status { color: #9fd1a0; font-size: 10px; margin-top: 8px; }
    .brush-caption {
      font-size: 10px;
      color: #666;
      line-height: 1.5;
      margin-top: 4px;
      font-style: italic;
    }
    .slider-panel { display: none; }
    .slider-panel.active { display: block; }

    #canvas-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0c0c0c;
      padding: 20px;
    }
    canvas {
      background: #fffceb;
      display: block;
      box-shadow: 0 4px 30px rgba(0,0,0,0.6);
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="sidebar">
      <h1>Project Brushstroke</h1>
      <div class="subtitle">Phase 4b — brush explorer</div>

      <nav style="display:flex;gap:8px;margin-bottom:12px;font-size:10px;letter-spacing:0.08em;">
        <span style="color:#9fd1a0;font-weight:bold;">Brushes</span>
        <a href="composition.html" style="color:#6da9ff;text-decoration:none;">Scenes</a>
      </nav>

      <div class="group">
        <div class="group-title">Brush</div>
        <select id="brushSel">
          <option value="fatLozenge">fat lozenge</option>
          <option value="gesturalSweep">gestural sweep</option>
          <option value="watercolorWash">watercolor wash</option>
          <option value="hairLine">hair line</option>
          <option value="chalkDrag">chalk drag</option>
          <option value="chalkScribble">chalk scribble</option>
          <option value="sprayField">spray field</option>
          <option value="registrationCross">registration cross</option>
        </select>
        <div id="brushCaption" class="brush-caption"></div>
      </div>

      <div class="group">
        <div class="group-title">Palette</div>
        <select id="paletteSel"></select>
      </div>

      <!-- hair line -->
      <div id="sliders-hairLine" class="slider-panel group">
        <div class="group-title">Parameters</div>
        <label class="block"><span class="l">weight<span class="v" data-disp="hl-weight"></span></span>
          <input type="range" id="hl-weight" min="0.5" max="10" step="0.1" value="1"></label>
        <label class="block"><span class="l">opacity<span class="v" data-disp="hl-opacity"></span></span>
          <input type="range" id="hl-opacity" min="0.1" max="1.0" step="0.01" value="0.85"></label>
        <label class="flex"><input type="checkbox" id="hl-blend" checked> blend with background</label>
      </div>

      <!-- fat lozenge -->
      <div id="sliders-fatLozenge" class="slider-panel group">
        <div class="group-title">Stamp parameters</div>
        <label class="block"><span class="l">weight<span class="v" data-disp="fl-weight"></span></span>
          <input type="range" id="fl-weight" min="2" max="30" step="0.5" value="6"></label>
        <label class="block"><span class="l">opacity<span class="v" data-disp="fl-opacity"></span></span>
          <input type="range" id="fl-opacity" min="0.2" max="1.0" step="0.01" value="0.75"></label>
        <label class="block"><span class="l">stamp jitter (°)<span class="v" data-disp="fl-jitter"></span></span>
          <input type="range" id="fl-jitter" min="0" max="20" step="0.5" value="4"></label>
        <label class="block"><span class="l">spacing mult<span class="v" data-disp="fl-spacing"></span></span>
          <input type="range" id="fl-spacing" min="0.1" max="1.0" step="0.05" value="0.25"></label>
        <label class="flex"><input type="checkbox" id="fl-blend" checked> blend with background</label>
        <div style="border-top:1px solid #2a2a2a;margin:8px 0 6px;padding-top:6px;">
          <div class="group-title" style="margin-bottom:6px;">Fan composition</div>
          <label class="block"><span class="l">fan angle jitter (°)<span class="v" data-disp="fl-fan-angle"></span></span>
            <input type="range" id="fl-fan-angle" min="0" max="30" step="0.5" value="10"></label>
          <label class="block"><span class="l">skip prob<span class="v" data-disp="fl-skip"></span></span>
            <input type="range" id="fl-skip" min="0" max="0.30" step="0.005" value="0.06"></label>
          <label class="block"><span class="l">secondary brush prob<span class="v" data-disp="fl-secondary"></span></span>
            <input type="range" id="fl-secondary" min="0" max="0.50" step="0.01" value="0.12"></label>
          <label class="block"><span class="l">starburst prob<span class="v" data-disp="fl-starburst"></span></span>
            <input type="range" id="fl-starburst" min="0" max="0.60" step="0.01" value="0.20"></label>
          <label class="block"><span class="l">teeth multiplier<span class="v" data-disp="fl-teeth"></span></span>
            <input type="range" id="fl-teeth" min="0.4" max="2.0" step="0.05" value="1.0"></label>
          <label class="block"><span class="l">weight min<span class="v" data-disp="fl-wmin"></span></span>
            <input type="range" id="fl-wmin" min="0.5" max="15" step="0.1" value="3.5"></label>
          <label class="block"><span class="l">weight max<span class="v" data-disp="fl-wmax"></span></span>
            <input type="range" id="fl-wmax" min="1" max="30" step="0.1" value="7.0"></label>
        </div>
      </div>

      <!-- chalk drag -->
      <div id="sliders-chalkDrag" class="slider-panel group">
        <div class="group-title">Parameters</div>
        <label class="block"><span class="l">weight<span class="v" data-disp="cd-weight"></span></span>
          <input type="range" id="cd-weight" min="1" max="20" step="0.5" value="3"></label>
        <label class="block"><span class="l">density<span class="v" data-disp="cd-density"></span></span>
          <input type="range" id="cd-density" min="0.5" max="3.0" step="0.1" value="1.0"></label>
        <label class="block"><span class="l">opacity<span class="v" data-disp="cd-opacity"></span></span>
          <input type="range" id="cd-opacity" min="0.2" max="1.0" step="0.01" value="0.55"></label>
        <label class="block"><span class="l">spacing mult<span class="v" data-disp="cd-spacing"></span></span>
          <input type="range" id="cd-spacing" min="0.2" max="1.5" step="0.05" value="0.5"></label>
        <label class="block"><span class="l">gappiness<span class="v" data-disp="cd-gappiness"></span></span>
          <input type="range" id="cd-gappiness" min="0" max="0.5" step="0.01" value="0.15"></label>
        <label class="flex"><input type="checkbox" id="cd-blend" checked> blend with background</label>
      </div>

      <!-- chalk scribble -->
      <div id="sliders-chalkScribble" class="slider-panel group">
        <div class="group-title">Parameters</div>
        <label class="block"><span class="l">weight<span class="v" data-disp="cs-weight"></span></span>
          <input type="range" id="cs-weight" min="1" max="16" step="0.5" value="2.5"></label>
        <label class="block"><span class="l">opacity<span class="v" data-disp="cs-opacity"></span></span>
          <input type="range" id="cs-opacity" min="0.2" max="1.0" step="0.01" value="0.65"></label>
        <label class="block"><span class="l">break prob<span class="v" data-disp="cs-break"></span></span>
          <input type="range" id="cs-break" min="0" max="0.8" step="0.01" value="0.35"></label>
        <label class="flex"><input type="checkbox" id="cs-blend" checked> blend with background</label>
      </div>

      <!-- spray field -->
      <div id="sliders-sprayField" class="slider-panel group">
        <div class="group-title">Parameters</div>
        <label class="block"><span class="l">radius<span class="v" data-disp="sf-radius"></span></span>
          <input type="range" id="sf-radius" min="10" max="120" step="1" value="50"></label>
        <label class="block"><span class="l">density<span class="v" data-disp="sf-density"></span></span>
          <input type="range" id="sf-density" min="20" max="150" step="1" value="80"></label>
        <label class="block"><span class="l">falloff<span class="v" data-disp="sf-falloff"></span></span>
          <input type="range" id="sf-falloff" min="0.3" max="2.0" step="0.05" value="1.0"></label>
        <label class="block"><span class="l">opacity<span class="v" data-disp="sf-opacity"></span></span>
          <input type="range" id="sf-opacity" min="0.1" max="0.8" step="0.01" value="0.45"></label>
      </div>

      <!-- watercolor wash -->
      <div id="sliders-watercolorWash" class="slider-panel group">
        <div class="group-title">Parameters</div>
        <label class="block"><span class="l">opacity<span class="v" data-disp="ww-opacity"></span></span>
          <input type="range" id="ww-opacity" min="0.05" max="0.6" step="0.01" value="0.35"></label>
        <label class="block"><span class="l">bleed<span class="v" data-disp="ww-bleed"></span></span>
          <input type="range" id="ww-bleed" min="0.1" max="0.8" step="0.01" value="0.4"></label>
        <label class="block"><span class="l">passes<span class="v" data-disp="ww-passes"></span></span>
          <input type="range" id="ww-passes" min="5" max="20" step="1" value="12"></label>
        <label class="block"><span class="l">edge softness<span class="v" data-disp="ww-softness"></span></span>
          <input type="range" id="ww-softness" min="0.1" max="1.0" step="0.05" value="0.5"></label>
        <label class="block"><span class="l">shape type<span class="v" data-disp="ww-shape"></span></span>
          <select id="ww-shape" style="margin-bottom:0;">
            <option value="blob">blob</option>
            <option value="ellipse">ellipse</option>
            <option value="rect">rect</option>
          </select>
        </label>
      </div>

      <!-- registration cross -->
      <div id="sliders-registrationCross" class="slider-panel group">
        <div class="group-title">Parameters</div>
        <label class="block"><span class="l">size<span class="v" data-disp="rc-size"></span></span>
          <input type="range" id="rc-size" min="3" max="20" step="0.5" value="6"></label>
        <label class="block"><span class="l">weight<span class="v" data-disp="rc-weight"></span></span>
          <input type="range" id="rc-weight" min="0.5" max="3" step="0.1" value="1"></label>
        <label class="block"><span class="l">rotation jitter (°)<span class="v" data-disp="rc-rotjitter"></span></span>
          <input type="range" id="rc-rotjitter" min="0" max="45" step="1" value="5"></label>
        <label class="block"><span class="l">opacity<span class="v" data-disp="rc-opacity"></span></span>
          <input type="range" id="rc-opacity" min="0.2" max="1.0" step="0.01" value="0.85"></label>
      </div>

      <!-- gestural sweep -->
      <div id="sliders-gesturalSweep" class="slider-panel group">
        <div class="group-title">Parameters</div>
        <label class="block"><span class="l">weight<span class="v" data-disp="gs-weight"></span></span>
          <input type="range" id="gs-weight" min="2" max="30" step="0.5" value="5"></label>
        <label class="block"><span class="l">opacity<span class="v" data-disp="gs-opacity"></span></span>
          <input type="range" id="gs-opacity" min="0.2" max="1.0" step="0.01" value="0.65"></label>
        <label class="block"><span class="l">taper<span class="v" data-disp="gs-taper"></span></span>
          <input type="range" id="gs-taper" min="0.5" max="3.0" step="0.1" value="1.6"></label>
        <label class="flex"><input type="checkbox" id="gs-blend" checked> blend with background</label>
      </div>

      <div class="group">
        <button id="regenBtn" class="primary">↻ Regenerate (R)</button>
        <div class="status" id="status">loading…</div>
      </div>
    </div>

    <div id="canvas-container">
      <canvas id="main"></canvas>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/spectral.js"></script>
  <script src="./brushes.js"></script>
  <script>
  const PALETTES = [
    { name: 'Blanc Ivoire',        bg: '#fffceb', colors: ['#2c695a','#4ad6af','#7facc6','#4e93cc','#f6684f','#ffd300'] },
    { name: 'Outremer Gris',       bg: '#e2e7dc', colors: ['#7b4800','#002185','#003c32','#fcd300','#ff2702','#6b9404'] },
    { name: 'Gris Clair',          bg: '#ccccc6', colors: ['#474238','#f4bd48','#9c2128','#395a8e','#7facc6','#2c695a'] },
    { name: 'Le Rubis',            bg: '#ffe6d4', colors: ['#6c2b3b','#c76282','#445e87','#003c32','#e0b411','#c8491b'] },
    { name: 'Playgrounds',         bg: '#c49a70', colors: ['#4e0042','#002185','#076d16','#feec00','#ff6900','#ff2702'] },
    { name: 'Bleu Outremer',       bg: '#4e6498', colors: ['#cdd3e3','#c6353c','#f6684f','#fcd300','#488b6d','#7fb4b5'] },
    { name: 'Bleu Outremer Foncé', bg: '#0e2d58', colors: ['#f4f4f4','#c8c9ca','#939598','#616568','#0e1318','#080f15'] },
    { name: "Noir d'Ivoire",       bg: '#080f15', colors: ['#C8C1B7','#d7d7d7','#b0b0b0','#8b8b8b','#676767','#464646'] },
  ];

  const CAPTIONS = {
    fatLozenge:       'Enfantines fan teeth. Short tapered stamp — the primary brush in most scene presets.',
    gesturalSweep:    'Long flowing color curves. Single-colour ribbon with strong taper at both ends.',
    watercolorWash:   'Translucent atmospheric regions. Multi-pass soft blob, reads as a wet smudge.',
    hairLine:         'Thin pencil-like accents and outlines. Bell pressure curve, ~1–2px wide.',
    chalkDrag:        'Granular pastel texture. Often mixed into fan teeth for roughness and grain.',
    chalkScribble:    'Short fragmented dashes, more broken than chalk drag. Layered cluster stamps.',
    sprayField:       'Scattered dots around a point. Radial distribution with power-law falloff.',
    registrationCross:'Composition layout guides. Small "+" marks at varied sizes and rotations.',
  };

  let palette = PALETTES[0];
  let currentBrush = 'fatLozenge';
  let seed = Math.random();
  let canvas, ctx, canvasW, canvasH;

  const { rand, randI, choice,
          catmullRom, pathLength, tangent, sampleGradient,
          hairLine, fatLozenge, chalkDrag, chalkScribble,
          sprayField, watercolorWash, registrationCross, gesturalSweep } = B;

  // ── Canvas setup ────────────────────────────────────────────────────────────
  function sizeCanvas() {
    const wrap = document.getElementById('canvas-container');
    const maxW = wrap.clientWidth - 40, maxH = wrap.clientHeight - 40;
    const aspect = 0.85;
    const h = Math.min(maxH, Math.floor(maxW / aspect));
    const w = Math.floor(h * aspect);
    canvas.width = w;
    canvas.height = h;
    canvasW = w;
    canvasH = h;
  }

  // ── Path generators ─────────────────────────────────────────────────────────
  function makeSCurve(x0, y0, x1, y1) {
    const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
    const dx = (x1 - x0) * 0.3, dy = (y1 - y0) * 0.3;
    return [
      { x: x0, y: y0 },
      { x: mx - dy * 0.6, y: my + dx * 0.6 },
      { x: mx + dy * 0.6, y: my - dx * 0.6 },
      { x: x1, y: y1 },
    ];
  }
  function makeArc(cx, cy, r, a0, a1, segs = 5) {
    const pts = [];
    for (let i = 0; i <= segs; i++) {
      const a = a0 + (a1 - a0) * (i / segs);
      pts.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r });
    }
    return pts;
  }

  // ── Get current opts from sliders ───────────────────────────────────────────
  function getVal(id) { return parseFloat(document.getElementById(id).value); }
  function getChk(id) { return document.getElementById(id).checked; }
  function getStr(id) { return document.getElementById(id).value; }

  function brushOpts() {
    switch (currentBrush) {
      case 'hairLine':         return { weight: getVal('hl-weight'), opacity: getVal('hl-opacity'), blend: getChk('hl-blend') };
      case 'fatLozenge':       return { weight: getVal('fl-weight'), opacity: getVal('fl-opacity'), jitterAngle: getVal('fl-jitter'), spacing: getVal('fl-spacing'), blend: getChk('fl-blend'), fanAngleJitter: getVal('fl-fan-angle'), skipProb: getVal('fl-skip'), secondaryBrushProb: getVal('fl-secondary'), starburstProb: getVal('fl-starburst'), teethMultiplier: getVal('fl-teeth'), weightMin: getVal('fl-wmin'), weightMax: getVal('fl-wmax') };
      case 'chalkDrag':        return { weight: getVal('cd-weight'), density: getVal('cd-density'), opacity: getVal('cd-opacity'), spacing: getVal('cd-spacing'), gappiness: getVal('cd-gappiness'), blend: getChk('cd-blend') };
      case 'chalkScribble':    return { weight: getVal('cs-weight'), opacity: getVal('cs-opacity'), breakProb: getVal('cs-break'), blend: getChk('cs-blend') };
      case 'sprayField':       return { radius: getVal('sf-radius'), density: getVal('sf-density'), falloff: getVal('sf-falloff'), opacity: getVal('sf-opacity') };
      case 'watercolorWash':   return { opacity: getVal('ww-opacity'), bleed: getVal('ww-bleed'), passes: getVal('ww-passes'), edgeSoftness: getVal('ww-softness'), shapeType: getStr('ww-shape') };
      case 'registrationCross':return { size: getVal('rc-size'), weight: getVal('rc-weight'), rotJitter: getVal('rc-rotjitter'), opacity: getVal('rc-opacity') };
      case 'gesturalSweep':    return { weight: getVal('gs-weight'), opacity: getVal('gs-opacity'), taper: getVal('gs-taper'), blend: getChk('gs-blend') };
    }
  }

  // ── Render samples ──────────────────────────────────────────────────────────
  function render() {
    if (!canvas) return;
    const t0 = performance.now();
    setStatus('rendering…');

    // Restore seed so Regenerate gives new layout, sliders re-render same layout
    const savedRandom = Math.random;
    let rngState = seed;
    const seededRand = () => {
      rngState = (rngState * 1664525 + 1013904223) & 0xffffffff;
      return (rngState >>> 0) / 0x100000000;
    };
    Math.random = seededRand;

    ctx.fillStyle = palette.bg;
    ctx.fillRect(0, 0, canvasW, canvasH);

    const opts = brushOpts();
    const cols = palette.colors;

    if (currentBrush === 'fatLozenge') {
      renderFanSamples(opts, cols);
    } else if (currentBrush === 'sprayField') {
      renderSpraySamples(opts, cols);
    } else if (currentBrush === 'watercolorWash') {
      renderWashSamples(opts, cols);
    } else if (currentBrush === 'registrationCross') {
      renderCrossSamples(opts, cols);
    } else {
      renderPathSamples(opts, cols);
    }

    Math.random = savedRandom;
    const dt = (performance.now() - t0).toFixed(0);
    setStatus(`${currentBrush} · ${dt}ms`);
  }

  function renderFanSamples(opts, cols) {
    const W = canvasW, H = canvasH;
    const minDim = Math.min(W, H);

    function pickStops(n) {
      const stops = [], used = new Set();
      while (stops.length < n && used.size < cols.length) {
        const ci = Math.floor(Math.random() * cols.length);
        if (!used.has(ci)) { used.add(ci); stops.push(cols[ci]); }
      }
      return stops;
    }

    const showStarburst = opts.starburstProb > 0.4;
    const doodles = showStarburst
      ? [
          { kind: 'fan',       cx: W * 0.30, cy: H * 0.38, size: minDim * 0.46, angle: Math.PI * 0.08 },
          { kind: 'starburst', cx: W * 0.72, cy: H * 0.64, size: minDim * 0.36 },
        ]
      : [
          { kind: 'fan', cx: W * 0.28, cy: H * 0.37, size: minDim * 0.46, angle: Math.PI * 0.08 },
          { kind: 'fan', cx: W * 0.72, cy: H * 0.65, size: minDim * 0.42, angle: Math.PI * 1.05 },
        ];

    for (const d of doodles) {
      const stops = pickStops(4);
      if (d.kind === 'starburst') drawStarburstPreview(d, opts, stops);
      else                         drawFanPreview(d, opts, stops);
    }
  }

  function drawFanPreview({ cx, cy, size, angle }, opts, stops) {
    const halfLen = size * 0.5;
    const perpA = angle + Math.PI / 2;
    const spinePts = [];
    for (let i = 0; i < 4; i++) {
      const t = i / 3;
      const along = -halfLen + 2 * halfLen * t;
      const wobble = (Math.random() - 0.5) * size * 0.18;
      spinePts.push({
        x: cx + Math.cos(angle) * along + Math.cos(perpA) * wobble,
        y: cy + Math.sin(angle) * along + Math.sin(perpA) * wobble,
      });
    }

    const N = Math.round(22 * opts.teethMultiplier);
    const halfWidth = size * 0.32;

    for (let i = 0; i < N; i++) {
      if (Math.random() < opts.skipProb) continue;
      const t = i / Math.max(1, N - 1);
      const here = catmullRom(spinePts, t);
      const tan = tangent(spinePts, t);
      const angleJit = (Math.random() * 2 - 1) * opts.fanAngleJitter * Math.PI / 180;
      const perpDir = tan + Math.PI / 2 + angleJit;

      const colorT = ((t * 3) + (Math.random() - 0.5) * 0.08) % 1;
      const col = sampleGradient(stops, (colorT + 1) % 1);

      const halfA = halfWidth * rand(0.7, 1.0);
      const halfB = halfWidth * rand(0.7, 1.0);
      const weight = rand(opts.weightMin, opts.weightMax);

      const toothPath = [
        { x: here.x - Math.cos(perpDir) * halfA, y: here.y - Math.sin(perpDir) * halfA },
        { x: here.x + Math.cos(perpDir) * halfB, y: here.y + Math.sin(perpDir) * halfB },
      ];

      fatLozenge(ctx, toothPath, {
        color: col, weight,
        opacity: opts.opacity,
        jitterAngle: opts.jitterAngle,
        spacing: opts.spacing,
        blend: opts.blend,
      });

      if (Math.random() < opts.secondaryBrushProb) {
        const accentCol = sampleGradient(stops, (colorT + 0.5) % 1);
        const scale = rand(0.55, 0.85);
        const accentPath = [
          { x: here.x - Math.cos(perpDir) * halfA * scale, y: here.y - Math.sin(perpDir) * halfA * scale },
          { x: here.x + Math.cos(perpDir) * halfB * scale, y: here.y + Math.sin(perpDir) * halfB * scale },
        ];
        hairLine(ctx, accentPath, { color: accentCol, weight: rand(0.5, 1.2), opacity: 0.75, blend: false });
      }
    }
  }

  function drawStarburstPreview({ cx, cy, size }, opts, stops) {
    const N = Math.round(16 * opts.teethMultiplier);
    const baseAngle = Math.random() * Math.PI * 2;
    for (let i = 0; i < N; i++) {
      if (Math.random() < opts.skipProb) continue;
      const ang = baseAngle + (i / N) * Math.PI * 2;
      const angleJit = (Math.random() * 2 - 1) * opts.fanAngleJitter * Math.PI / 180;
      const finalAng = ang + angleJit;
      const len = size * rand(0.30, 0.52);
      const innerR = len * 0.10;
      const path = [
        { x: cx + Math.cos(finalAng) * innerR,        y: cy + Math.sin(finalAng) * innerR },
        { x: cx + Math.cos(finalAng) * len * 0.4,     y: cy + Math.sin(finalAng) * len * 0.4 },
        { x: cx + Math.cos(finalAng) * len * 0.8,     y: cy + Math.sin(finalAng) * len * 0.8 },
        { x: cx + Math.cos(finalAng) * len,           y: cy + Math.sin(finalAng) * len },
      ];
      const col = sampleGradient(stops, i / N);
      fatLozenge(ctx, path, {
        color: col, weight: rand(opts.weightMin, opts.weightMax),
        opacity: opts.opacity,
        jitterAngle: opts.jitterAngle,
        spacing: opts.spacing,
        blend: opts.blend,
      });
    }
  }

  function renderPathSamples(opts, cols) {
    const W = canvasW, H = canvasH;
    const pad = W * 0.08;
    // 6 paths: 2 S-curves, 2 arcs, 2 diagonals, arranged in 2 columns × 3 rows
    const samples = [
      // col 0 (left half)
      makeSCurve(pad, H * 0.18, W * 0.45, H * 0.38),
      makeArc(W * 0.22, H * 0.58, W * 0.15, Math.PI * 0.9, Math.PI * 2.1),
      [{ x: pad, y: H * 0.82 }, { x: W * 0.42, y: H * 0.92 }],
      // col 1 (right half)
      makeSCurve(W * 0.55, H * 0.12, W - pad, H * 0.35),
      makeArc(W * 0.75, H * 0.58, W * 0.17, Math.PI * 1.1, Math.PI * 2.3),
      [{ x: W * 0.58, y: H * 0.80 }, { x: W - pad, y: H * 0.95 }],
    ];

    samples.forEach((path, i) => {
      const col = cols[i % cols.length];
      const w = opts.weight * (0.7 + (i % 3) * 0.3);
      const o = { ...opts, color: col, weight: w };
      switch (currentBrush) {
        case 'hairLine':      hairLine(ctx, path, o); break;
        case 'fatLozenge':    fatLozenge(ctx, path, o); break;
        case 'chalkDrag':     chalkDrag(ctx, path, o); break;
        case 'chalkScribble': chalkScribble(ctx, path, o); break;
        case 'gesturalSweep': gesturalSweep(ctx, path, o); break;
      }
    });
  }

  function renderSpraySamples(opts, cols) {
    const W = canvasW, H = canvasH;
    // 6 sprays at varied positions and sizes
    const positions = [
      [W * 0.20, H * 0.25], [W * 0.55, H * 0.20], [W * 0.80, H * 0.45],
      [W * 0.15, H * 0.70], [W * 0.50, H * 0.72], [W * 0.82, H * 0.78],
    ];
    positions.forEach(([cx, cy], i) => {
      const col = cols[i % cols.length];
      const r = opts.radius * (0.5 + (i % 3) * 0.4);
      sprayField(ctx, cx, cy, { ...opts, color: col, radius: r });
    });
  }

  function renderWashSamples(opts, cols) {
    const W = canvasW, H = canvasH;
    const shapeType = opts.shapeType || 'blob';
    // 5 washes at varied positions/sizes
    const configs = [
      { cx: W * 0.22, cy: H * 0.25, w: W * 0.28, h: H * 0.28 },
      { cx: W * 0.72, cy: H * 0.22, w: W * 0.22, h: H * 0.22 },
      { cx: W * 0.18, cy: H * 0.70, w: W * 0.20, h: H * 0.24 },
      { cx: W * 0.55, cy: H * 0.60, w: W * 0.32, h: H * 0.30 },
      { cx: W * 0.82, cy: H * 0.72, w: W * 0.18, h: H * 0.18 },
    ];
    configs.forEach((cfg, i) => {
      const col = cols[i % cols.length];
      watercolorWash(ctx, { ...cfg, type: shapeType }, {
        color: col,
        opacity: opts.opacity,
        bleed: opts.bleed,
        passes: Math.round(opts.passes),
        edgeSoftness: opts.edgeSoftness,
      });
    });
  }

  function renderCrossSamples(opts, cols) {
    const W = canvasW, H = canvasH;
    // 8 crosses scattered
    const positions = [
      [W * 0.12, H * 0.15], [W * 0.38, H * 0.12], [W * 0.65, H * 0.18], [W * 0.88, H * 0.10],
      [W * 0.20, H * 0.60], [W * 0.50, H * 0.55], [W * 0.72, H * 0.65], [W * 0.85, H * 0.80],
    ];
    positions.forEach(([x, y], i) => {
      const col = cols[i % cols.length];
      const sz = opts.size * (0.6 + (i % 3) * 0.4);
      const rot = (rand(-opts.rotJitter, opts.rotJitter) * Math.PI) / 180;
      registrationCross(ctx, x, y, { ...opts, color: col, size: sz, rotation: rot });
    });
  }

  function setStatus(text) {
    document.getElementById('status').textContent = text;
  }

  // ── Slider display update ───────────────────────────────────────────────────
  function syncDisplays() {
    document.querySelectorAll('[data-disp]').forEach(el => {
      const id = el.dataset.disp;
      const input = document.getElementById(id);
      if (input && input.type === 'range') {
        const v = parseFloat(input.value);
        el.textContent = Number.isInteger(v) ? v : v.toFixed(2);
      }
    });
  }

  // ── Brush switcher ──────────────────────────────────────────────────────────
  function selectBrush(name) {
    currentBrush = name;
    document.querySelectorAll('.slider-panel').forEach(p => p.classList.remove('active'));
    const panel = document.getElementById('sliders-' + name);
    if (panel) panel.classList.add('active');
    document.getElementById('brushCaption').textContent = CAPTIONS[name] || '';
    syncDisplays();
    regenerate();
  }

  function regenerate() {
    seed = Math.random() * 0xffffffff;
    render();
  }

  // ── Boot ────────────────────────────────────────────────────────────────────
  function boot() {
    if (typeof spectral === 'undefined' || !window.B) {
      setStatus('waiting for deps…');
      setTimeout(boot, 60);
      return;
    }

    canvas = document.getElementById('main');
    ctx = canvas.getContext('2d');
    sizeCanvas();

    // Palette dropdown
    const palSel = document.getElementById('paletteSel');
    PALETTES.forEach((p, i) => {
      const o = document.createElement('option'); o.value = i; o.textContent = p.name;
      palSel.appendChild(o);
    });
    palSel.addEventListener('change', e => { palette = PALETTES[parseInt(e.target.value)]; render(); });

    // Brush dropdown
    document.getElementById('brushSel').addEventListener('change', e => selectBrush(e.target.value));

    // All range sliders → update display live, re-render on release
    document.querySelectorAll('input[type=range]').forEach(el => {
      el.addEventListener('input', () => {
        const disp = document.querySelector(`[data-disp="${el.id}"]`);
        if (disp) {
          const v = parseFloat(el.value);
          disp.textContent = Number.isInteger(v) ? v : v.toFixed(2);
        }
      });
      el.addEventListener('change', render);
    });

    // Checkboxes → re-render immediately
    document.querySelectorAll('input[type=checkbox]').forEach(el => {
      el.addEventListener('change', render);
    });

    // Watercolor shape select
    const wwShape = document.getElementById('ww-shape');
    if (wwShape) wwShape.addEventListener('change', render);

    // Regenerate button + keyboard
    document.getElementById('regenBtn').addEventListener('click', regenerate);
    window.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if (e.key === 'r' || e.key === 'R') regenerate();
    });

    // Resize
    let resizeTO = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTO);
      resizeTO = setTimeout(() => { sizeCanvas(); render(); }, 200);
    });

    selectBrush('fatLozenge');
  }

  boot();
  </script>
</body>
</html>
