<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enfantines Study — p5.brush spectral blending</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #1a1a1a; color: #ddd; font-family: 'SF Mono', Menlo, monospace; font-size: 12px; overflow: hidden; }
    #container { display: flex; flex-direction: column; height: 100vh; }
    #controls {
      padding: 10px 16px; background: rgba(20,20,20,0.95); border-bottom: 1px solid #333;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap; z-index: 10;
      flex-shrink: 0; row-gap: 8px;
    }
    #title { font-size: 12px; letter-spacing: 2px; color: #a9c1ff; text-transform: uppercase; margin-right: 4px; }
    button, select {
      background: #2a2a2a; color: #ddd; border: 1px solid #444; padding: 5px 12px;
      border-radius: 3px; cursor: pointer; font: inherit; font-size: 11px;
    }
    button:hover, select:hover { background: #353535; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    label { display: inline-flex; align-items: center; gap: 4px; color: #888; }
    label input[type=checkbox] { cursor: pointer; }
    #status { color: #888; font-size: 11px; margin-left: auto; }
    #seedInput { background: #1a1a1a; color: #ccc; border: 1px solid #444; padding: 4px 8px; width: 110px; border-radius: 3px; font: inherit; font-size: 11px; }
    #canvas-container { flex: 1; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; background: #0c0c0c; }
    #canvas-container canvas { max-width: 100%; max-height: 100%; box-shadow: 0 4px 30px rgba(0,0,0,0.6); }
    :fullscreen #controls { display: none; }
    .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 2px; vertical-align: middle; margin-right: 4px; border: 1px solid rgba(255,255,255,0.2); }
  </style>
</head>
<body>
<div id="container">
  <div id="controls">
    <span id="title">enfantines study</span>
    <button id="regenBtn">↻ New</button>
    <button id="saveBtn">💾 PNG</button>
    <label>Palette:
      <select id="paletteSel"></select>
    </label>
    <label>Brushes:
      <select id="brushSel">
        <option value="enfantines">Enfantines mix (pencil+marker+spray)</option>
        <option value="pencils">Pencils only (HB/2B/cpencil)</option>
        <option value="markers">Markers + washes</option>
        <option value="ink">Ink + hatch</option>
        <option value="rough">Rough (charcoal + spray)</option>
        <option value="hard">Hard-edge (sharp marker + pencil)</option>
      </select>
    </label>
    <label>Style:
      <select id="styleSel"></select>
      <button id="saveStyleBtn" title="Save current toggles + brush mix as a named style">★ Save as…</button>
      <button id="deleteStyleBtn" title="Delete the selected custom style">✕</button>
    </label>
    <label>Density:
      <select id="densitySel">
        <option value="sparse">Sparse</option>
        <option value="medium" selected>Medium</option>
        <option value="dense">Dense</option>
      </select>
    </label>
    <label><input type="checkbox" id="bgWash" checked> bg wash</label>
    <label><input type="checkbox" id="hatchBg"> hatch bg</label>
    <label><input type="checkbox" id="crossMarks" checked> + marks</label>
    <label><input type="checkbox" id="colorCurves" checked> color curves</label>
    <input type="text" id="seedInput" placeholder="seed (optional)">
    <button id="fullscreenBtn">⛶</button>
    <span id="status">loading…</span>
  </div>
  <div id="canvas-container"></div>
</div>

<script src="p5.min.js"></script>
<script src="p5.brush.js"></script>
<script src="sketch.js"></script>
</body>
</html>
