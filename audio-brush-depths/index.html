<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Brush Depths</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #f0ede6;
      color: #3a3530;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    #container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #controls {
      padding: 10px 18px;
      background: rgba(247, 245, 240, 0.94);
      border-bottom: 1px solid rgba(100, 80, 50, 0.2);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      z-index: 10;
      font-size: 12px;
    }

    #title {
      font-size: 13px;
      letter-spacing: 2px;
      color: #6a5030;
      text-transform: uppercase;
      margin-right: 6px;
    }

    button {
      background: #ebe5d5;
      color: #3a3530;
      border: 1px solid rgba(100, 80, 50, 0.3);
      padding: 5px 14px;
      border-radius: 3px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      letter-spacing: 1px;
    }
    button:hover  { background: #ddd6c2; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }

    #fullscreenBtn {
      border-color: rgba(0, 60, 50, 0.4);
      margin-left: auto;
    }

    input[type="file"] {
      background: #f0ead8;
      color: #6a5030;
      border: 1px solid rgba(100, 80, 50, 0.25);
      padding: 4px 8px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      cursor: pointer;
    }
    input[type="file"]::-webkit-file-upload-button {
      background: #ddd6c2;
      color: #3a3530;
      border: none;
      padding: 3px 8px;
      border-radius: 2px;
      cursor: pointer;
      margin-right: 6px;
      font-size: 11px;
    }

    #status {
      font-size: 11px;
      color: #8a7a60;
      min-width: 220px;
    }
    #status.loading { color: #6a5030; }
    #status.ready   { color: #003c32; }
    #status.error   { color: #c02020; }

    #meters {
      display: flex;
      gap: 10px;
      font-size: 10px;
      color: #8a7a60;
    }
    .meter { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .meter-bar {
      width: 6px;
      height: 30px;
      background: #e8e0d0;
      border-radius: 2px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
    }
    .meter-fill {
      width: 100%;
      border-radius: 2px;
      transition: height 0.05s;
    }
    .bass-fill { background: #c04020; }
    .mid-fill  { background: #c09020; }
    .high-fill { background: #2040a0; }

    #canvas-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    /* Only style the MAIN p5 canvas — p5.brush creates internal framebuffer
       canvases via createGraphics() that must keep their native dimensions. */
    #defaultCanvas0 {
      display: block;
      position: absolute;
      top: 0; left: 0;
      width: 100% !important;
      height: 100% !important;
    }

    :fullscreen #controls,
    :-webkit-full-screen #controls,
    :-moz-full-screen #controls { display: none; }
  </style>
</head>
<body>
<div id="container">
  <div id="controls">
    <span id="title">Depths</span>

    <button id="playBtn" disabled>Play</button>
    <button id="stopBtn" disabled>Stop</button>

    <div id="meters">
      <div class="meter">
        <div class="meter-bar"><div id="bassMeter" class="meter-fill bass-fill" style="height:0%"></div></div>
        <span>B</span>
      </div>
      <div class="meter">
        <div class="meter-bar"><div id="midMeter"  class="meter-fill mid-fill"  style="height:0%"></div></div>
        <span>M</span>
      </div>
      <div class="meter">
        <div class="meter-bar"><div id="highMeter" class="meter-fill high-fill" style="height:0%"></div></div>
        <span>H</span>
      </div>
    </div>

    <span id="status">Ready</span>

    <input type="file" id="audioFile" accept="audio/*" title="Load a different audio file">

    <button id="fullscreenBtn">[ Fullscreen ]</button>
  </div>

  <div id="canvas-container"></div>
</div>

<script src="p5.min.js"></script>
<script src="p5.brush.js"></script>
<script src="audio-engine.js"></script>
<script src="sketch.js"></script>
</body>
</html>
