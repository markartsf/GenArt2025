<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brush Lab — Enfantines Ribbon (v1)</title>

<!--
  BRUSH LAB v1  ·  isolated, static, no audio
  ----------------------------------------------------------------------------
  Purpose: nail the "multicolour comb riding a spline" look in isolation,
  BEFORE wiring it into the audio-reactive performance app.

  ARCHITECTURE (per SPEC.md) — station-based generator:
    A ribbon is a GENERATOR, not a brush.
      - Spine     : a Catmull-Rom spline through a few control points.
      - Stations  : points resampled along the spine at fixed ARC LENGTH
                    (= Spacing). One tooth per station.
      - Tooth     : ONE short textured stroke drawn PERPENDICULAR to the spine
                    (along the path normal), in ONE palette colour.
      - Comb      : the emergent look of many perpendicular teeth packed along
                    the spine.
      - Envelope  : tooth length tapers toward the spine's ends.

    WHY station placement is OUR job, not the library's: p5.brush's stamp
    engine drags a tip ALONG a path, so brush.spline() can only make strokes
    PARALLEL to the spine. Teeth that CROSS the spine at a right angle must be
    placed by the generator and drawn as individual strokes. p5.brush still
    owns each tooth's texture/pressure via brush.line() with a chosen brush.

    Colour respects SPEC §0: each brush.set() call is ONE colour. Multicolour
    = consecutive stations cycle through the palette. Never one brush, many
    colours.

  All p5.brush-specific calls are quarantined in the >>> P5.BRUSH ADAPTER <<<
  block. If a v2 API name/signature is off, fix it THERE only.

  Run:  served on :8080  ->  http://localhost:8080/brush-lab.html

  CDN: p5 2.x + p5.brush 2.1.9-beta (p5 build, needs WEBGL canvas).
-->
<script src="https://cdn.jsdelivr.net/npm/p5@2/lib/p5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/p5.brush@2.1.9-beta/dist/p5.brush.min.js"></script>

<style>
  :root { --panel: rgba(20,20,24,0.86); --ink:#f4efe7; --muted:#9a948c; --acc:#e9c46a; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; background:#0e0e12; overflow:hidden;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; color:var(--ink); }
  #canvas-holder { position:fixed; inset:0; display:grid; place-items:center; }
  #panel {
    position:fixed; top:16px; left:16px; width:288px; max-height:calc(100vh - 32px);
    overflow-y:auto; background:var(--panel); backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:18px 18px 22px;
    font-size:12px; z-index:10; }
  #panel h1 { font-size:13px; letter-spacing:0.14em; text-transform:uppercase;
    font-weight:600; margin:0 0 2px; }
  #panel .sub { color:var(--muted); font-size:10.5px; letter-spacing:0.12em;
    text-transform:uppercase; margin:0 0 16px; }
  .group { margin-bottom:13px; }
  .row { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
  label { color:var(--muted); letter-spacing:0.04em; }
  .val { color:var(--acc); font-variant-numeric:tabular-nums; font-size:11px; }
  input[type=range]{ width:100%; accent-color:var(--acc); height:3px; }
  select{ width:100%; background:#1b1b20; color:var(--ink); border:1px solid rgba(255,255,255,0.1);
    border-radius:7px; padding:6px 8px; font-size:12px; }
  .toggle{ display:flex; align-items:center; gap:8px; cursor:pointer; }
  .toggle input{ accent-color:var(--acc); }
  .divider{ height:1px; background:rgba(255,255,255,0.08); margin:15px 0; }
  .swatches{ display:flex; gap:6px; flex-wrap:wrap; }
  .swatches input[type=color]{ width:30px; height:30px; border:none; border-radius:7px;
    background:none; cursor:pointer; padding:0; }
  .seedrow{ display:flex; gap:6px; align-items:center; }
  .seedrow .seedval{ flex:1; text-align:center; background:#1b1b20; border-radius:7px;
    padding:6px 0; font-variant-numeric:tabular-nums; letter-spacing:0.06em; }
  button{ flex:1; background:#26262d; color:var(--ink); border:1px solid rgba(255,255,255,0.1);
    border-radius:8px; padding:8px 6px; font-size:11px; letter-spacing:0.04em; cursor:pointer; }
  button:hover{ background:#32323b; }
  button.primary{ background:var(--acc); color:#1a1a1a; border-color:transparent; font-weight:600; }
  .btnrow{ display:flex; gap:6px; margin-top:6px; }
</style>
</head>
<body>
<div id="canvas-holder"></div>

<div id="panel">
  <h1>Brush Lab</h1>
  <p class="sub">Enfantines Ribbon · v1</p>

  <div class="group">
    <div class="row"><label>Generator</label></div>
    <select id="gensel"></select>
  </div>
  <div class="group">
    <div class="row"><label>Count</label><span class="val" id="v_ribbons">3</span></div>
    <input type="range" id="ribbons" min="1" max="12" step="1" value="3">
  </div>
  <div class="group">
    <div class="row"><label>Spine control pts</label><span class="val" id="v_ctrl">5</span></div>
    <input type="range" id="ctrl" min="3" max="10" step="1" value="5">
  </div>
  <div class="group">
    <div class="row"><label>Tooth spacing (px)</label><span class="val" id="v_spacing">11</span></div>
    <input type="range" id="spacing" min="3" max="40" step="1" value="11">
  </div>
  <div class="group">
    <div class="row"><label>Ribbon width (px)</label><span class="val" id="v_width">120</span></div>
    <input type="range" id="width" min="20" max="320" step="1" value="120">
  </div>
  <div class="group">
    <div class="row"><label>Stroke weight</label><span class="val" id="v_weight">1.4</span></div>
    <input type="range" id="weight" min="0.3" max="15" step="0.1" value="1.4">
  </div>
  <div class="group">
    <div class="row"><label>Angle jitter (°)</label><span class="val" id="v_anglej">8</span></div>
    <input type="range" id="anglej" min="0" max="60" step="1" value="8">
  </div>
  <div class="group">
    <div class="row"><label>Length jitter</label><span class="val" id="v_lenj">0.25</span></div>
    <input type="range" id="lenj" min="0" max="0.9" step="0.01" value="0.25">
  </div>
  <div class="group">
    <div class="row">
      <label>Tooth bias <span style="color:var(--muted);font-size:10px;">inside ← 0 → outside</span></label>
      <span class="val" id="v_bias">0.00</span>
    </div>
    <input type="range" id="bias" min="-1" max="1" step="0.05" value="0">
  </div>
  <div class="group">
    <div class="row">
      <label>Radial offset <span style="color:var(--muted);font-size:10px;">hub → spread</span></label>
      <span class="val" id="v_radialoffset">0.00</span>
    </div>
    <input type="range" id="radialoffset" min="0" max="1" step="0.05" value="0">
  </div>
  <div class="group" id="taperGroup">
    <div class="row"><label>Width taper (ends)</label><span class="val" id="v_taper">0.6</span></div>
    <input type="range" id="taper" min="0" max="1" step="0.01" value="0.6">
  </div>
  <div class="group" id="swirlGroup" style="display:none;">
    <div class="row"><label>Swirl amount (°)</label><span class="val" id="v_swirl">60</span></div>
    <input type="range" id="swirl" min="-180" max="180" step="1" value="60">
  </div>
  <div class="group" id="fieldcountGroup" style="display:none;">
    <div class="row"><label>Field count</label><span class="val" id="v_fieldcount">200</span></div>
    <input type="range" id="fieldcount" min="50" max="800" step="10" value="200">
  </div>
  <div class="group" id="fieldscaleGroup" style="display:none;">
    <div class="row"><label>Field scale</label><span class="val" id="v_fieldscale">0.0030</span></div>
    <input type="range" id="fieldscale" min="0.0005" max="0.012" step="0.0005" value="0.003">
  </div>
  <div class="group" id="fanspreadGroup" style="display:none;">
    <div class="row"><label>Fan spread (°)</label><span class="val" id="v_fanspread">110</span></div>
    <input type="range" id="fanspread" min="30" max="270" step="1" value="110">
  </div>

  <div class="divider"></div>

  <div class="group">
    <div class="row"><label>Brush</label></div>
    <select id="brushsel"></select>
  </div>
  <div class="group">
    <div class="row"><label>Base Weight</label><span class="val" id="v_mat_weight"></span></div>
    <input type="range" id="mat_weight" min="0.1" max="10.0" step="0.1" value="1.0">
  </div>
  <div class="group">
    <div class="row"><label>Vibration</label><span class="val" id="v_mat_vib"></span></div>
    <input type="range" id="mat_vib" min="0.0" max="2.0" step="0.05" value="0.1">
  </div>
  <div class="group">
    <div class="row"><label>Colour order</label></div>
    <select id="colormode">
      <option value="random">Random per tooth</option>
      <option value="sequential">Sequential cycle</option>
      <option value="runs">Runs (streaks of one)</option>
    </select>
  </div>
  <div class="group">
    <label style="display:block;margin-bottom:7px;">Palette</label>
    <div class="swatches" id="swatches"></div>
  </div>
  <label class="toggle group"><input type="checkbox" id="drawspine"> Draw spine</label>
  <div class="group">
    <div class="row"><label>Spine weight (pt)</label><span class="val" id="v_spineweight">6</span></div>
    <input type="range" id="spineweight" min="1" max="20" step="0.5" value="6">
  </div>

  <div class="divider"></div>

  <label style="display:block;color:var(--muted);margin-bottom:6px;">Seed</label>
  <div class="seedrow">
    <button id="seedPrev">‹</button>
    <div class="seedval" id="seedval">1</div>
    <button id="seedNext">›</button>
    <button id="seedRand">⤬</button>
  </div>
  <div class="btnrow">
    <button class="primary" id="regen">Regenerate (random seed)</button>
    <button id="reset">Reset</button>
  </div>
  <div class="btnrow">
    <button id="download">Download PNG</button>
  </div>

  <div class="divider"></div>
  <label style="display:block;color:var(--muted);margin-bottom:6px;">Presets</label>
  <select id="presetLib" style="margin-bottom:6px;"></select>
  <div class="btnrow">
    <button class="primary" id="presetLoadSel">Load</button>
    <button id="presetSaveLib">Save to library</button>
    <button id="presetDelete">Delete</button>
  </div>
  <div class="btnrow">
    <button id="presetSave">Export JSON ⤓</button>
    <button id="presetLoadBtn">Load from file…</button>
    <input type="file" id="presetLoad" accept=".json,application/json" style="display:none">
  </div>
</div>

<script>
// ============================================================================
//  PARAMETERS
// ============================================================================
const DEFAULTS = {
  ribbons:3, ctrl:5, spacing:11, width:120, weight:1.4,
  anglej:8, lenj:0.25, taper:0.6, bias:0, radialoffset:0, swirl:60, colormode:'random', drawspine:false,
  spineweight:6,
  fieldcount:200, fieldscale:0.003,
  fanspread:110,
  generator:'ribbon',
  // a fresh, Satie-ish primary-on-cream test palette; edit freely
  palette:['#e63946','#1d3557','#e9c46a','#2a9d8f','#c97fa8','#7d4f2a','#f1faee'],
  bg:'#efe7d8',
};
let P = structuredClone(DEFAULTS);
let seed = 1;
let availableBrushes = [];

const BRUSH_REGISTRY = {
  'pen':      { baseWeight: 1.0,  vibration: 0.1 },
  'marker':   { baseWeight: 2.5,  vibration: 0.2 },
  'rotring':  { baseWeight: 0.8,  vibration: 0.05 },
  'charcoal': { baseWeight: 4.0,  vibration: 0.8 },
  'spray':    { baseWeight: 8.0,  vibration: 1.0 },
  'custom':   { baseWeight: 5.0,  vibration: 0.5 },
  // Fallback for any discovered brush not explicitly tuned yet
  'default':  { baseWeight: 2.0,  vibration: 0.3 }
};

// ============================================================================
//  >>> P5.BRUSH ADAPTER <<<  (the only library-specific code)
//  If a v2 signature differs in your installed build, fix it here only.
// ============================================================================

// 1. discover which brushes exist in this build (version-proof, with fallback)
function discoverBrushes(){
  try {
    if (typeof brush.box === 'function') {
      const b = brush.box();
      if (Array.isArray(b) && b.length) return b;
    }
  } catch(e){ /* fall through */ }
  return ['marker','pen','rotring','2B','HB','2H','cpencil','pastel','crayon','charcoal','spray'];
}

// 2. set the current brush to a given colour + weight
function useBrush(name, hex, weight){
  brush.set(name, hex, weight);
}

// 3. draw ONE textured tooth: a short stroke from a→b in SCREEN coords.
//    The generator passes endpoints already oriented along the path normal.
function stamp(ax, ay, bx, by){
  brush.line(ax, ay, bx, by);
}

function rebuildCustomBrush() {
  const cfg = BRUSH_REGISTRY['custom'];
  if (!cfg) return;
  
  try {
    brush.add('custom', {
      type: 'custom',
      weight: cfg.baseWeight,
      vibration: cfg.vibration,
      opacity: 60,
      spacing: 0.2,
      blend: true,
      pressure: { 
        type: 'standard', 
        curve: [0.2, 0.8], // The missing DNA
        min_max: [0.8, 1.2] 
      },
      tip: function() {
        fill(0);
        noStroke();
        circle(0, 0, 1.5);
      }
    });
  } catch(e) {
    console.error("Brush Engine Error:", e);
  }
}
// ============================================================================
//  END ADAPTER
// ============================================================================


// ---- spline math (Catmull-Rom) : OUR code — the spine geometry -------------
function catmullRom(p0,p1,p2,p3,t){
  const t2=t*t, t3=t2*t;
  return {
    x:0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
    y:0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)
  };
}
// sample a control-point list into a dense polyline
function samplePolyline(pts, stepsPer=24){
  const out=[];
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||pts[i+1];
    for(let s=0;s<stepsPer;s++) out.push(catmullRom(p0,p1,p2,p3,s/stepsPer));
  }
  out.push(pts[pts.length-1]);
  return out;
}
// resample a polyline at fixed ARC-LENGTH spacing → Stations {x,y,nx,ny,u}
//   nx,ny = unit NORMAL (perpendicular to the spine tangent)
//   u     = 0..1 position along the whole spine (for the width envelope)
function placeStations(poly, spacing){
  const stations=[]; let total=0;
  const segLen=[];
  for(let i=1;i<poly.length;i++){
    const d=dist(poly[i-1].x,poly[i-1].y,poly[i].x,poly[i].y);
    segLen.push(d); total+=d;
  }
  let target=0, run=0;
  for(let i=1;i<poly.length;i++){
    const a=poly[i-1], b=poly[i], L=segLen[i-1]||0.0001;
    while(run+L>=target){
      const f=(target-run)/L;
      const x=a.x+(b.x-a.x)*f, y=a.y+(b.y-a.y)*f;
      let tx=b.x-a.x, ty=b.y-a.y; const m=Math.hypot(tx,ty)||1; tx/=m; ty/=m;
      stations.push({x,y,nx:-ty,ny:tx,u:total?target/total:0}); // normal = perp to tangent
      target+=spacing;
    }
    run+=L;
  }
  return stations;
}

// ---- ribbon generation -----------------------------------------------------
function makeControlPoints(n){
  // a loose drifting path across the canvas, seeded
  const pad=120, pts=[];
  let x=random(pad,width-pad), y=random(pad,height-pad);
  let ang=random(TWO_PI);
  for(let i=0;i<n;i++){
    pts.push({x,y});
    ang+=random(-0.9,0.9);
    const step=random(120,260);
    x=constrain(x+cos(ang)*step,pad,width-pad);
    y=constrain(y+sin(ang)*step,pad,height-pad);
  }
  return pts;
}

function pickColor(i, ribbonOffset){
  const pal=P.palette;
  if(P.colormode==='sequential') return pal[(i+ribbonOffset)%pal.length];
  if(P.colormode==='runs')      return pal[(floor(i/5)+ribbonOffset)%pal.length];
  return pal[floor(random(pal.length))]; // random
}

// Shared tooth renderer — used by every Generator. Takes Stations
// {x,y,nx,ny,u}; draws one textured tooth per Station along its (nx,ny).
function drawTeeth(stations, colorOffset){
  const activeBrushName = currentBrush();
  const brushConfig = BRUSH_REGISTRY[activeBrushName] || BRUSH_REGISTRY['default'];
  const finalWeight = P.weight * brushConfig.baseWeight;

  for(let i=0;i<stations.length;i++){
    const s=stations[i];
    // width envelope: taper tooth length toward both ends (u→0/1)
    const env=1-P.taper*Math.pow(Math.abs(s.u*2-1),1.6);
    const halfLen=(P.width*0.5)*env*(1-random(0,P.lenj));
    // jitter the tooth angle off the exact normal (0 = exact right angle)
    const j=radians(random(-P.anglej,P.anglej));
    const nx=s.nx*cos(j)-s.ny*sin(j);
    const ny=s.nx*sin(j)+s.ny*cos(j);
    // Tooth bias: shift both endpoints along the (jittered) normal by bias*halfLen.
    // b=0 → symmetric (today's behavior); b=±1 → entirely on one flank. Length preserved.
    // Radial offset: per-tooth random outward push along the SAME normal, on top of
    // bias — varies each tooth's START distance from the hub (loose spray, not a
    // uniform ring). offset=0 → unchanged. Length still 2*halfLen; only start moves.
    const shift  = P.bias * halfLen;
    const offset = random(0, P.radialoffset) * halfLen;
    const push   = shift + offset;
    const ax = s.x - nx*halfLen + nx*push, ay = s.y - ny*halfLen + ny*push;
    const bx = s.x + nx*halfLen + nx*push, by = s.y + ny*halfLen + ny*push;
    useBrush(activeBrushName, pickColor(i,colorOffset), finalWeight);
    stamp(ax,ay,bx,by);
  }
}

// RIBBON Generator — teeth along an open spine, crossing it at the normal.
function drawRibbon(ribbonIndex){
  const cps  = makeControlPoints(P.ctrl);
  const poly = samplePolyline(cps);
  const stations = placeStations(poly, P.spacing);
  if(P.drawspine) drawSpineLine(poly);
  drawTeeth(stations, ribbonIndex*3);
}

// BURST Generator — Stations spread by ANGLE around a centre point; each tooth
// radiates outward. The "spine" collapses to a point (SPEC §3).
function makeBurstStations(cx, cy){
  const R0 = P.width * 0.55;                              // mid-radius teeth centre on
  const count = max(3, round(TWO_PI * R0 / P.spacing));   // arc-spacing → angle
  const out = [];
  for(let i=0;i<count;i++){
    const a = (i / count) * TWO_PI;
    const dx = cos(a), dy = sin(a);                       // radial direction = tooth normal
    out.push({ x:cx+dx*R0, y:cy+dy*R0, nx:dx, ny:dy, u:0.5 });
  }
  return out;
}
function drawBurst(burstIndex){
  const pad = 170;
  const cx = random(pad, width-pad), cy = random(pad, height-pad);
  const stations = makeBurstStations(cx, cy);
  if(P.drawspine){ push(); noStroke(); fill(0); circle(cx,cy,P.spineweight*2); pop(); }
  drawTeeth(stations, burstIndex*3);
}

// BLOOM Generator — Stations spread by ANGLE but modulated by 2D Perlin noise
function makeBloomStations(cx, cy){
  const R0 = P.width * 0.55;
  const count = max(3, round(TWO_PI * R0 / P.spacing));
  const out = [];
  
  // Use a noise offset so each bloom gets a different organic shape
  const nOffX = random(1000);
  const nOffY = random(1000);
  const noiseScale = 1.5; // Increased for more distinct lobes
  
  for(let i=0;i<count;i++){
    const a = (i / count) * TWO_PI;
    const dx = cos(a), dy = sin(a);
    
    // Sample 2D noise in a circle for a seamless continuous loop
    const noiseX = nOffX + cos(a) * noiseScale;
    const noiseY = nOffY + sin(a) * noiseScale;
    const n = noise(noiseX, noiseY);
    
    // Exaggerate the noise mapping to push the peaks and valleys much further
    // p5 noise typically yields values between ~0.25 and 0.75
    const r = R0 * map(n, 0.25, 0.75, 0.2, 2.5);
    
    // Swirl: rotate normal vector (which defines tooth orientation)
    const swirlAngle = radians(P.swirl);
    const toothNx = cos(a + swirlAngle);
    const toothNy = sin(a + swirlAngle);
    
    // Map radius to U so teeth get longer (thicker ribbon) at petal ends (u=0.5 -> max envelope)
    // and shorter at the center (u=0 -> min envelope)
    const uVal = map(n, 0.25, 0.75, 0, 0.5);
    
    out.push({ x:cx+dx*r, y:cy+dy*r, nx:toothNx, ny:toothNy, u:uVal });
  }
  return out;
}

function drawBloom(bloomIndex){
  const pad = 170;
  const cx = random(pad, width-pad), cy = random(pad, height-pad);
  const stations = makeBloomStations(cx, cy);
  if(P.drawspine){ push(); noStroke(); fill(0); circle(cx,cy,P.spineweight*2); pop(); }
  drawTeeth(stations, bloomIndex*3);
}

// FIELD MARKS Generator — Stations scattered across the whole canvas; each
// tooth's normal is sampled from a 2D Perlin flow field so the marks read as
// a coherent hatch rather than random scatter (SPEC §3 "Ground texture",
// Enfantines' faint diagonal hatch). Singleton: one field per render,
// regardless of the top-level count loop. u=0.5 makes drawTeeth's end-taper
// envelope neutral (there are no ends — it's a field).
function makeFieldMarksStations(count, scale){
  const out = [];
  for(let i=0;i<count;i++){
    const x = random(width);
    const y = random(height);
    const a = noise(x*scale, y*scale) * TWO_PI;
    // tangent (cos a, sin a) → tooth lies along the flow line, like a stitch
    const tx = cos(a), ty = sin(a);
    out.push({ x, y, nx:tx, ny:ty, u:0.5 });
  }
  return out;
}
function drawFieldMarks(idx){
  if(idx > 0) return;                                          // singleton field
  const stations = makeFieldMarksStations(P.fieldcount, P.fieldscale);
  drawTeeth(stations, 0);
}

// FAN Generator — constrained cousin of Burst (SPEC §3 — "Teeth fanning along
// a short arc with fingers spreading at the tips; the orange corals and
// purple sea-fans in the references"). Stations span fanspread° centered on a
// random base orientation, each tooth radiating outward. u=0.5 → drawTeeth's
// end-taper envelope is neutral, like Burst/Bloom (no "ends" on an arc).
// Placed form, not singleton: top-level count loop runs P.ribbons instances,
// each with its own center + base angle (mirrors Burst/Bloom).
function makeFanStations(cx, cy, baseRad, spreadRad){
  const R0 = P.width * 0.55;
  const arc = spreadRad * R0;
  const count = max(3, round(arc / P.spacing));
  const out = [];
  const a0 = baseRad - spreadRad * 0.5;
  for(let i=0;i<count;i++){
    // sample inclusive endpoints (i/(count-1)) so the fan fills its full arc
    const a = a0 + spreadRad * (i / (count - 1));
    const dx = cos(a), dy = sin(a);
    out.push({ x:cx+dx*R0, y:cy+dy*R0, nx:dx, ny:dy, u:0.5 });
  }
  return out;
}
function drawFan(fanIndex){
  const pad = 170;
  const cx = random(pad, width-pad), cy = random(pad, height-pad);
  const baseRad   = random(TWO_PI);                            // each fan points its own way
  const spreadRad = radians(P.fanspread);
  const stations = makeFanStations(cx, cy, baseRad, spreadRad);
  if(P.drawspine){ push(); noStroke(); fill(0); circle(cx,cy,P.spineweight*2); pop(); }
  drawTeeth(stations, fanIndex*3);
}

// Generator registry — each entry declares its allowed Brushes (SPEC §1.5
// decision 1) and its draw fn. Adding a generator = one entry here, no
// switch statements anywhere.
// Fan allowedBrushes rationale: §3 sea-fans / corals are sturdy organic
// radiating forms — marker gives the chunky fan-rib weight, charcoal the
// organic coral texture. Pen/rotring read too thin to register as a fan
// against the Ground; spray loses the radiating-line geometry.
const GENERATORS = {
  ribbon:     { label:'Ribbon',      allowedBrushes:['pen','marker'],      biasDefault:0,   draw:drawRibbon     },
  burst:      { label:'Burst',       allowedBrushes:null,                  biasDefault:1.0, draw:drawBurst      },
  bloom:      { label:'Bloom',       allowedBrushes:null,                  biasDefault:1.0, draw:drawBloom      },
  fan:        { label:'Fan',         allowedBrushes:['marker','charcoal'], biasDefault:1.0, draw:drawFan        },
  fieldmarks: { label:'Field Marks', allowedBrushes:['pen','rotring'],     biasDefault:0,   draw:drawFieldMarks }
};

// Drawn Spine — a SOLID black stroke along the spine path. Rendered with plain
// p5 (not the p5.brush adapter) so it NEVER inherits the active Brush.
// SPEC §1.5 decision 3.
function drawSpineLine(poly){
  push();
  noFill();
  stroke(0);                       // black, independent of Brush + Palette
  strokeWeight(P.spineweight);
  beginShape();
  for(const pt of poly) vertex(pt.x, pt.y);
  endShape();
  pop();
}

function currentBrush(){
  const sel=document.getElementById('brushsel');
  return (sel && sel.value) || availableBrushes[0] || 'marker';
}

// ---- generator UI sync -----------------------------------------------------
// brushes the active generator permits, intersected with what the build has
function activeAllowedBrushes(){
  const allowed = GENERATORS[P.generator].allowedBrushes;
  if(!allowed) return availableBrushes.slice();   // null/undefined = no constraint
  const have = allowed.filter(b => availableBrushes.includes(b));
  return have.length ? have : availableBrushes.slice(0,1);
}
// rebuild the Brush <select> to the allowed set; fall back to first allowed
// if the current pick isn't permitted by the active generator
function refreshBrushOptions(){
  const sel=document.getElementById('brushsel');
  const allowed=activeAllowedBrushes(), prev=sel.value;
  sel.innerHTML='';
  allowed.forEach(n=>{ const o=document.createElement('option'); o.value=n; o.textContent=n; sel.appendChild(o); });
  sel.value = allowed.includes(prev) ? prev : allowed[0];
}
// populate the Generator <select> from the registry (data-driven)
function populateGenSelect(){
  const sel=document.getElementById('gensel');
  const currentVal=sel.value || P.generator;
  sel.innerHTML='';
  Object.keys(GENERATORS).forEach(k=>{
    const o=document.createElement('option'); o.value=k; o.textContent=GENERATORS[k].label; sel.appendChild(o);
  });
  sel.value=currentVal;
}
function syncMaterialSliders() {
  const bName = document.getElementById('brushsel').value;
  const cfg = BRUSH_REGISTRY[bName] || BRUSH_REGISTRY['default'];
  if (!cfg) return;
  document.getElementById('mat_weight').value = cfg.baseWeight;
  document.getElementById('v_mat_weight').textContent = parseFloat(cfg.baseWeight).toFixed(1);
  document.getElementById('mat_vib').value = cfg.vibration;
  document.getElementById('v_mat_vib').textContent = parseFloat(cfg.vibration).toFixed(2);
}

// sync UI to the active generator: filter brushes + hide taper on Burst
function updateGeneratorUI(){
  refreshBrushOptions();
  syncMaterialSliders();
  const tg=document.getElementById('taperGroup');
  if(tg) tg.style.display = (P.generator==='burst' || P.generator==='bloom' || P.generator==='fieldmarks' || P.generator==='fan') ? 'none' : '';   // taper neutral on Burst/Bloom/FieldMarks/Fan
  const sg=document.getElementById('swirlGroup');
  if(sg) sg.style.display = (P.generator==='bloom') ? '' : 'none';
  const fcg=document.getElementById('fieldcountGroup');
  if(fcg) fcg.style.display = (P.generator==='fieldmarks') ? '' : 'none';
  const fsg=document.getElementById('fieldscaleGroup');
  if(fsg) fsg.style.display = (P.generator==='fieldmarks') ? '' : 'none';
  const fang=document.getElementById('fanspreadGroup');
  if(fang) fang.style.display = (P.generator==='fan') ? '' : 'none';
}

// ---- p5 lifecycle ----------------------------------------------------------
function setup(){
  const c=createCanvas(min(windowWidth-340,1100), min(windowHeight-40,900), WEBGL);
  c.parent('canvas-holder');
  pixelDensity(2);
  try { if (typeof brush.load==='function') brush.load(); } catch(e){}
  try { if (typeof brush.noField==='function') brush.noField(); } catch(e){}
  try { if (typeof brush.scaleBrushes==='function') brush.scaleBrushes(1); } catch(e){}
  availableBrushes = discoverBrushes();
  availableBrushes.push('custom'); rebuildCustomBrush();
  buildSwatches();
  noLoop();
  wireUI();              // wire controls here — p5 is ready, so redraw() is safe
  updateGeneratorUI();   // filter brushes + taper visibility for current generator
  regenerate(seed);
}

function draw(){
  randomSeed(seed); noiseSeed(seed);          // reproducible per seed
  try { if (typeof brush.seed==='function') brush.seed(seed); } catch(e){}
  background(P.bg);
  push();
  translate(-width/2,-height/2);              // WEBGL origin → top-left screen coords
  for(let i=0;i<P.ribbons;i++) GENERATORS[P.generator].draw(i);
  pop();
}

function regenerate(s){
  if(s!==undefined) seed=s;
  document.getElementById('seedval').textContent=seed;
  redraw();
}

// ---- Preset save / load — tier-3 handoff object (SPEC §1.5 dec. 4) ---------
// Canonical shape: { schema, name, generator, brush, seed, params, palette, bg }.
// `schema` starts with "brushstroke.preset/" — version suffix is forward-compat.
// Serialize the live editor state into a canonical brushstroke.preset/1 object.
// Shared by Export-to-JSON (savePreset) and Save-to-library (saveToLibrary).
function buildPresetObject(name){
  return {
    schema: 'brushstroke.preset/1',
    name,
    generator: P.generator,
    brush: currentBrush(),
    seed,
    params: { ...P },
    material: {
      baseWeight: parseFloat(document.getElementById('mat_weight').value),
      vibration:  parseFloat(document.getElementById('mat_vib').value)
    },
    palette: [...P.palette],
    bg: P.bg
  };
}

function savePreset(){
  const defaultName = `${P.generator}-seed${seed}`;
  const name = (prompt('Export preset as:', defaultName) || '').trim();
  if(!name) return;
  const preset = buildPresetObject(name);
  const blob = new Blob([JSON.stringify(preset, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name.replace(/[^\w.-]+/g, '_') + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function loadPreset(j){
  // ---- validate fully BEFORE touching any state (no partial apply on reject) --
  if(!j || j.schema !== 'brushstroke.preset/1'){
    throw new Error("Not a brushstroke.preset/1 (schema was '" + (j && j.schema) + "').");
  }
  if(!GENERATORS[j.generator]){
    throw new Error("Unknown generator '" + j.generator + "' (not in GENERATORS).");
  }
  // Reuse activeAllowedBrushes(): it reads P.generator, so set it to the incoming
  // generator to compute the allowed set, then RESTORE it if the brush is invalid
  // — keeps P untouched on reject.
  const _savedGen = P.generator;
  P.generator = j.generator;
  const _allowed = activeAllowedBrushes();
  if(!j.brush || !_allowed.includes(j.brush)){
    P.generator = _savedGen;
    throw new Error("Brush '" + j.brush + "' not allowed for generator '" + j.generator +
                    "' (allowed: " + _allowed.join(', ') + ").");
  }
  // P.generator is now the validated incoming generator; cascade continues below.

  // Stub redraw() during the cascade. Each slider 'input' dispatch otherwise
  // triggers bindSlider's apply → redraw(), so loading a preset would fire
  // ~13 rapid redraws with intermediate params. Empirically p5.brush 2.x
  // leaves the canvas mid-state in that case (the FINAL redraw paints only a
  // handful of strokes instead of the full set). One clean redraw after the
  // whole state is settled renders correctly.
  const realRedraw = window.redraw;
  window.redraw = () => {};
  try {
    // 1. generator first — drives allowedBrushes + UI visibility downstream
    P.generator = j.generator;
    document.getElementById('gensel').value = P.generator;
    // 2. params → P, then push to sliders (reset-handler pattern: setting the
    //    slider + dispatching 'input' triggers bindSlider's apply, which writes
    //    parseFloat(el.value) back into P — keeps slider DOM and P in sync)
    Object.assign(P, j.params || {});
    // Backward compat: presets predating Tooth Bias have no params.bias →
    // load as 0 (symmetric) rather than inheriting the previous editor value.
    if(!j.params || j.params.bias === undefined) P.bias = 0;
    if(!j.params || j.params.radialoffset === undefined) P.radialoffset = 0;
    ['ribbons','ctrl','spacing','width','weight','anglej','lenj','taper','bias','radialoffset','swirl','fieldcount','fieldscale','fanspread','spineweight'].forEach(id=>{
      const el = document.getElementById(id);
      if(el && P[id] !== undefined){
        el.value = P[id];
        el.dispatchEvent(new Event('input'));
      }
    });
    // 3. non-slider controls
    const cm = document.getElementById('colormode');
    if(P.colormode !== undefined){ cm.value = P.colormode; cm.dispatchEvent(new Event('change')); }
    const ds = document.getElementById('drawspine');
    if(P.drawspine !== undefined){ ds.checked = !!P.drawspine; ds.dispatchEvent(new Event('change')); }
    // 4. palette + bg (top-level fields are canonical; params copies are redundant)
    if(Array.isArray(j.palette)) P.palette = [...j.palette];
    if(j.bg) P.bg = j.bg;
    buildSwatches();
    // 5. seed
    if(j.seed !== undefined){
      seed = j.seed;
      document.getElementById('seedval').textContent = seed;
    }
    // 6. refresh generator-specific UI — rebuilds brush <select> to allowed set
    updateGeneratorUI();
    // 7. apply brush AFTER allowed list is current (validated up front, always OK)
    const bsel = document.getElementById('brushsel');
    bsel.value = j.brush;
    // 8. material: write the saved values into the brush's registry entry, then
    //    push registry → sliders/labels via syncMaterialSliders()
    if(j.material && BRUSH_REGISTRY[j.brush]){
      BRUSH_REGISTRY[j.brush].baseWeight = j.material.baseWeight;
      BRUSH_REGISTRY[j.brush].vibration  = j.material.vibration;
    }
    syncMaterialSliders();
    if(j.brush === 'custom') rebuildCustomBrush();
  } finally {
    window.redraw = realRedraw;
  }
  redraw();                                                    // one clean paint
}

// ---- Preset library — folder-backed (dev server) or localStorage fallback --
// SPEC §1.5 dec.4 (amended): JSON files in presets/ are canonical. When the Vite
// dev server's /__presets endpoint answers (folder mode), the library reads and
// writes those files directly, so saved presets persist on disk across sessions.
// With no server (static host / file://) it falls back to localStorage + the
// bundled presets/index.json manifest, so nothing breaks.
const PRESET_LS_KEY = 'brushstroke.presets/1';
const PRESET_API    = '/__presets';
const PRESET_NAME_RE = /^[A-Za-z0-9_-]+$/;        // becomes a filename — keep it safe
let folderMode = false;
let folderPresets  = {};   // name -> preset (folder mode, from the dev endpoint)
let bundledPresets = {};   // name -> preset (fallback, read-only from index.json)

function lsLoad(){
  try { return JSON.parse(localStorage.getItem(PRESET_LS_KEY)) || {}; }
  catch(e){ console.warn('preset localStorage unreadable:', e); return {}; }
}
function lsSave(store){
  try { localStorage.setItem(PRESET_LS_KEY, JSON.stringify(store)); }
  catch(e){ console.warn('preset localStorage write failed:', e); alert('Could not save to browser storage: ' + e.message); }
}

// Probe the dev-server folder API; fall back to the static bundled manifest.
async function loadPresetLibrary(){
  folderPresets = {}; bundledPresets = {};
  try {
    const res = await fetch(PRESET_API, { method: 'GET' });
    if(res.ok){
      const data = await res.json();
      (data.presets || []).forEach(p => { if(p && p.preset && p.name) folderPresets[p.name] = p.preset; });
      folderMode = true;
      refreshPresetSelect();
      return;
    }
  } catch(e){ /* no dev endpoint — use static fallback below */ }

  folderMode = false;
  try {
    const idx = await fetch('presets/index.json').then(r => r.ok ? r.json() : Promise.reject('HTTP ' + r.status));
    const files = Array.isArray(idx) ? idx : (idx.presets || []);
    await Promise.all(files.map(async f => {
      try {
        const p = await fetch('presets/' + f).then(r => r.json());
        bundledPresets[p.name || f.replace(/\.json$/, '')] = p;
      } catch(e){ console.warn('bundled preset failed to load:', f, e); }
    }));
  } catch(e){ console.warn('presets/index.json not loaded:', e); }
  refreshPresetSelect();
}

function refreshPresetSelect(){
  const sel = document.getElementById('presetLib');
  const prev = sel.value;
  sel.innerHTML = '';
  const placeholder = document.createElement('option');
  placeholder.value = ''; placeholder.textContent = '— select a preset —';
  placeholder.disabled = true; placeholder.selected = true;
  sel.appendChild(placeholder);

  const mkGroup = (label, names, prefix) => {
    if(!names.length) return;
    const og = document.createElement('optgroup'); og.label = label;
    names.sort().forEach(n => {
      const o = document.createElement('option');
      o.value = prefix + ':' + n; o.textContent = n;
      og.appendChild(o);
    });
    sel.appendChild(og);
  };
  if(folderMode){
    mkGroup('Presets (presets/ folder)', Object.keys(folderPresets), 'folder');
  } else {
    mkGroup('Bundled', Object.keys(bundledPresets), 'bundled');
    mkGroup('Saved (this browser)', Object.keys(lsLoad()), 'saved');
  }

  // restore prior selection if it still exists
  if(prev && [...sel.options].some(o => o.value === prev)) sel.value = prev;
}

// "source:name" → the preset object, or null
function resolvePreset(value){
  if(!value) return null;
  const i = value.indexOf(':');
  const src = value.slice(0, i), name = value.slice(i + 1);
  if(src === 'folder')  return folderPresets[name]  || null;
  if(src === 'bundled') return bundledPresets[name] || null;
  if(src === 'saved')   return lsLoad()[name]       || null;
  return null;
}

function loadFromLibrary(){
  const sel = document.getElementById('presetLib');
  const preset = resolvePreset(sel.value);
  if(!preset){ alert('Pick a preset from the list first.'); return; }
  try { loadPreset(preset); }
  catch(e){ console.error(e); alert('Load failed: ' + e.message); }
}

async function saveToLibrary(){
  const name = (prompt('Save preset as:', `${P.generator}-seed${seed}`) || '').trim();
  if(!name) return;
  if(!PRESET_NAME_RE.test(name)){
    alert('Use letters, numbers, dashes or underscores only — the name becomes a filename.');
    return;
  }
  const preset = buildPresetObject(name);

  if(folderMode){
    if(folderPresets[name] && !confirm(`A preset named "${name}" exists. Overwrite the file?`)) return;
    try {
      const res = await fetch(`${PRESET_API}/${encodeURIComponent(name)}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(preset)
      });
      if(!res.ok){ const e = await res.json().catch(()=>({})); throw new Error(e.error || ('HTTP ' + res.status)); }
      folderPresets[name] = preset;
      refreshPresetSelect();
      document.getElementById('presetLib').value = 'folder:' + name;
    } catch(e){ console.error(e); alert('Save to folder failed: ' + e.message); }
  } else {
    const store = lsLoad();
    if(store[name] && !confirm(`A saved preset named "${name}" exists. Overwrite it?`)) return;
    store[name] = preset; lsSave(store);
    refreshPresetSelect();
    document.getElementById('presetLib').value = 'saved:' + name;
  }
}

async function deleteFromLibrary(){
  const sel = document.getElementById('presetLib');
  const value = sel.value;
  if(!value){ alert('Pick a preset to delete.'); return; }
  const src = value.slice(0, value.indexOf(':')), name = value.slice(value.indexOf(':') + 1);

  if(folderMode){
    if(src !== 'folder') return;
    if(!confirm(`Delete preset file "${name}.json" from presets/? (Removes it from disk — commit when ready.)`)) return;
    try {
      const res = await fetch(`${PRESET_API}/${encodeURIComponent(name)}`, { method: 'DELETE' });
      if(!res.ok){ const e = await res.json().catch(()=>({})); throw new Error(e.error || ('HTTP ' + res.status)); }
      delete folderPresets[name];
      refreshPresetSelect();
    } catch(e){ console.error(e); alert('Delete failed: ' + e.message); }
  } else {
    if(src !== 'saved'){
      alert('Only presets saved in this browser can be deleted. Bundled presets live in presets/ in the repo.');
      return;
    }
    if(!confirm(`Delete saved preset "${name}"? (This only removes the browser copy — any exported JSON file is untouched.)`)) return;
    const store = lsLoad(); delete store[name]; lsSave(store);
    refreshPresetSelect();
  }
}

// ---- UI wiring -------------------------------------------------------------
function bindSlider(id, key, fmt){
  const el=document.getElementById(id), out=document.getElementById('v_'+id);
  const apply=()=>{ P[key]=parseFloat(el.value); if(out) out.textContent=fmt?fmt(P[key]):el.value; redraw(); };
  el.addEventListener('input', apply); apply();
}
function buildSwatches(){
  const wrap=document.getElementById('swatches'); wrap.innerHTML='';
  P.palette.forEach((hex,idx)=>{
    const c=document.createElement('input'); c.type='color'; c.value=hex;
    c.addEventListener('input',e=>{ P.palette[idx]=e.target.value; redraw(); });
    wrap.appendChild(c);
  });
}

function wireUI(){
  bindSlider('ribbons','ribbons'); bindSlider('ctrl','ctrl');
  bindSlider('spacing','spacing'); bindSlider('width','width');
  bindSlider('weight','weight',v=>v.toFixed(1)); bindSlider('anglej','anglej');
  bindSlider('lenj','lenj',v=>v.toFixed(2)); bindSlider('taper','taper',v=>v.toFixed(2));
  bindSlider('bias','bias',v=>v.toFixed(2));
  bindSlider('radialoffset','radialoffset',v=>v.toFixed(2));
  bindSlider('swirl','swirl');
  bindSlider('fieldcount','fieldcount');
  bindSlider('fieldscale','fieldscale',v=>v.toFixed(4));
  bindSlider('fanspread','fanspread');
  bindSlider('spineweight','spineweight',v=>v.toFixed(1));
  populateGenSelect();
  
  document.getElementById('mat_weight').addEventListener('input', e => {
    const bName = document.getElementById('brushsel').value;
    if(BRUSH_REGISTRY[bName]) BRUSH_REGISTRY[bName].baseWeight = parseFloat(e.target.value);
    document.getElementById('v_mat_weight').textContent = parseFloat(e.target.value).toFixed(1);
    if (document.getElementById('brushsel').value === 'custom') { rebuildCustomBrush(); }
    redraw();
  });
  document.getElementById('mat_vib').addEventListener('input', e => {
    const bName = document.getElementById('brushsel').value;
    if(BRUSH_REGISTRY[bName]) BRUSH_REGISTRY[bName].vibration = parseFloat(e.target.value);
    document.getElementById('v_mat_vib').textContent = parseFloat(e.target.value).toFixed(2);
    if (document.getElementById('brushsel').value === 'custom') { rebuildCustomBrush(); }
    redraw();
  });

  document.getElementById('brushsel').addEventListener('change', () => {
    syncMaterialSliders();
    redraw();
  });
  document.getElementById('gensel').addEventListener('change',e=>{
    P.generator=e.target.value;
    // Per-generator bias default — windswept on radial, symmetric on Ribbon/Field Marks.
    // Only runs on user-initiated change. loadPreset sets gensel.value WITHOUT
    // dispatching 'change', so a saved preset's bias always wins (see loadPreset).
    const bd = GENERATORS[P.generator].biasDefault ?? 0;
    P.bias = bd;
    const bEl = document.getElementById('bias');
    bEl.value = bd;
    document.getElementById('v_bias').textContent = bd.toFixed(2);
    updateGeneratorUI(); redraw();
  });
  document.getElementById('colormode').addEventListener('change',e=>{P.colormode=e.target.value;redraw();});
  document.getElementById('drawspine').addEventListener('change',e=>{P.drawspine=e.target.checked;redraw();});
  document.getElementById('regen').addEventListener('click',()=>regenerate(floor(Math.random()*99999)));
  document.getElementById('seedPrev').addEventListener('click',()=>regenerate(Math.max(0,seed-1)));
  document.getElementById('seedNext').addEventListener('click',()=>regenerate(seed+1));
  document.getElementById('seedRand').addEventListener('click',()=>regenerate(floor(Math.random()*99999)));
  document.getElementById('download').addEventListener('click',()=>saveCanvas('brush-lab_seed'+seed,'png'));
  document.getElementById('presetSave').addEventListener('click', savePreset);
  document.getElementById('presetLoadBtn').addEventListener('click', () => document.getElementById('presetLoad').click());
  document.getElementById('presetLoad').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = ev => {
      try { loadPreset(JSON.parse(ev.target.result)); }
      catch(err){ console.error(err); alert('Load failed: ' + err.message); }
    };
    r.readAsText(f);
    e.target.value = '';                                       // allow reloading same file
  });
  // preset library (bundled + localStorage saved set)
  document.getElementById('presetLoadSel').addEventListener('click', loadFromLibrary);
  document.getElementById('presetSaveLib').addEventListener('click', saveToLibrary);
  document.getElementById('presetDelete').addEventListener('click', deleteFromLibrary);
  loadPresetLibrary();                                          // populate dropdown (async)
  document.getElementById('reset').addEventListener('click',()=>{
    P=structuredClone(DEFAULTS);
    ['ribbons','ctrl','spacing','width','weight','anglej','lenj','taper','bias','radialoffset','swirl','fieldcount','fieldscale','fanspread','spineweight'].forEach(id=>{
      document.getElementById(id).value=P[id];
      document.getElementById(id).dispatchEvent(new Event('input'));
    });
    document.getElementById('colormode').value=P.colormode;
    document.getElementById('gensel').value=P.generator;
    document.getElementById('drawspine').checked=P.drawspine;
    buildSwatches(); updateGeneratorUI(); redraw();
  });
}

function windowResized(){
  resizeCanvas(min(windowWidth-340,1100), min(windowHeight-40,900));
  redraw();
}
</script>
