<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Composition — multi-plate KM (M3 · composition staging)</title>
<!--
  COMPOSITION · M3 strand (b) · the milestone finish line
  ======================================================================
  Stages a real composition through the cached multi-plate Kubelka-Munk
  compositor lifted from the dense/perf spike (verdict b39ae13):

      plate 0  Ground   — swappable quiet base (cream+noise / image)   [groundProducer]
      plate 1  Hero     — Tuft, owned pigment pipeline                 [tuftGenerator]
      (commit 2 inserts Wash beneath the hero; commit 3 adds Accent on top)

  p5 (instance, P2D) hosts the canvas + rAF loop + pixelDensity + append-only
  reveal; raw-WebGL2 KM is the pigment path (no p5.brush — it can't emit recipe
  channel codes). Opaque output: translucency is compositional, never alpha.

  Serve over HTTP (ES modules): `python3 -m http.server 8091` from this dir, or Vite.
  Sized once at load at 2× DPR; window resize → reload (never resize a live GL canvas).
-->
<script src="https://cdn.jsdelivr.net/npm/p5@2.2/lib/p5.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#0e0e12;overflow:hidden}
  #canvas-holder{position:fixed;inset:0;display:grid;place-items:center}
  #hud{position:fixed;top:10px;left:10px;font:11px ui-monospace,Menlo,monospace;color:#9a948c;
       background:rgba(14,14,18,.72);border:1px solid #333;border-radius:6px;padding:7px 9px;
       display:flex;gap:7px;align-items:center;user-select:none;z-index:10}
  #hud.hide{display:none}
  #hud button{font:inherit;background:#1c1c22;color:#f4efe7;border:1px solid #444;border-radius:5px;padding:3px 8px;cursor:pointer}
  #hud button:hover{border-color:#e9c46a;color:#e9c46a}
  #hud .stat{color:#e9c46a}
  #err{position:fixed;bottom:10px;left:14px;right:14px;color:#e07a5f;font:11px ui-monospace,monospace;white-space:pre-wrap;z-index:20}
</style>
</head>
<body>
<div id="canvas-holder"></div>
<div id="hud">
  <span class="stat" id="stat">booting…</span>
  <button data-k="r">R · replay</button>
  <button data-k="s">S · save</button>
  <span style="color:#5a554e">h · hide</span>
</div>
<div id="err"></div>

<script type="module">
import { startComposition } from './compositionHost.js';
import { buildGround } from './groundProducer.js';
import { washMarks } from './washGenerator.js';
import { tuftMarks } from './tuftGenerator.js';

const hud = document.getElementById('hud');
const statEl = document.getElementById('stat');

let app;
try {
  app = startComposition({
    holderId: 'canvas-holder',
    seed: 11,
    revealMs: 4200,
    ground: (W, H, scale) => buildGround(W, H, { noise: 0.035, contrast: 0 }),
    layers: [
      { name: 'wash', gen: (W, H, seed, scale) => washMarks(W, H, seed, scale) },
      { name: 'hero', gen: (W, H, seed, scale) => tuftMarks(W, H, seed, scale) },
    ],
  });
} catch (e) {
  document.getElementById('err').textContent = 'FATAL: ' + (e.message || e);
  console.error(e);
}

function apply(k) {
  k = (k || '').toLowerCase();
  if (k === 'r') app && app.replay();
  else if (k === 's') app && app.savePNG();
  else if (k === 'h') hud.classList.toggle('hide');
}
window.addEventListener('keydown', e => { if (['r','s','h'].includes(e.key.toLowerCase())) { apply(e.key); e.preventDefault(); } });
document.querySelectorAll('#hud button').forEach(b => b.addEventListener('click', () => apply(b.dataset.k)));
window.onerror = (m) => { document.getElementById('err').textContent = 'ERROR: ' + m; };

// live stat readout
setInterval(() => { if (app && app.stats) { const s = app.stats(); statEl.textContent = `${s.state} · ${(s.t*100)|0}% · ${s.plates} plates · ${s.kmPasses} KM/frame · ${s.frameMs}ms @${s.dpr}x`; } }, 200);
</script>
</body>
</html>
