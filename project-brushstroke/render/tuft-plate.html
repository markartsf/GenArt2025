<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tuft Plate — owned pigment pipeline (M3 · commit 1)</title>
<!--
  TUFT PLATE · M3 owned-pigment, commit 1 · STATIC · SINGLE PLATE · OPAQUE
  ========================================================================
  The first real feature build of the owned pigment pipeline. Tuft stamps a
  recipe-B mask (own canvas2D, NOT p5.brush); a raw-WebGL2 Kubelka-Munk shader
  composites that mask onto an opaque cream ground in one pass. One still frame.

  Scope: Tuft → recipe mask → KM → one opaque plate, standing still. NO plate-
  cache, NO multi-plate / wash-under-hero, NO modulation — those fold in later.

  Serve over HTTP (ES modules): `python3 -m http.server` from this dir, or Vite.
  Sized once at load at 2x DPR; window resize → reload (never resize a live GL canvas).
-->
<style>
  html,body{margin:0;height:100%;background:#0e0e12;overflow:hidden}
  #stage{display:block;width:100vw;height:100vh}
  #hud{position:fixed;top:10px;left:10px;font:11px ui-monospace,Menlo,monospace;color:#9a948c;
       background:rgba(14,14,18,.72);border:1px solid #333;border-radius:6px;padding:7px 9px;
       display:flex;gap:7px;align-items:center;user-select:none}
  #hud.hide{display:none}
  #hud button{font:inherit;background:#1c1c22;color:#f4efe7;border:1px solid #444;border-radius:5px;
              padding:3px 8px;cursor:pointer}
  #hud button:hover{border-color:#e9c46a;color:#e9c46a}
  #hud .stat{color:#e9c46a}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hud">
  <span class="stat" id="stat">…</span>
  <button data-k="r">R · reseed</button>
  <button data-k="s">S · save</button>
  <span style="color:#5a554e">h · hide</span>
</div>

<script type="module">
import { tuftTeeth, toothWeight } from './tuftGenerator.js';
import { buildMask } from './recipeMask.js';
import { createCompositor } from './kmCompositor.js';

const stage = document.getElementById('stage');
const ctx2d = stage.getContext('2d');
const statEl = document.getElementById('stat');
const hud = document.getElementById('hud');

// size once at load — backing store at 2x DPR (retina), CSS at window size
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const W = Math.round(window.innerWidth * DPR);
const H = Math.round(window.innerHeight * DPR);
stage.width = W; stage.height = H;
stage.style.width = window.innerWidth + 'px';
stage.style.height = window.innerHeight + 'px';

// marks stay small relative to the frame (DESIGN #7): scale geometry to frame size
const frameScale = Math.min(W, H) / 620;
let seed = 3;
let compositor;

function render() {
  const tg0 = performance.now();
  const teeth = tuftTeeth(W, H, seed, frameScale);
  const mask = buildMask(W, H, teeth, toothWeight(frameScale));
  const tMask = performance.now() - tg0;
  const tKM = compositor.render(mask, { seed: (seed % 97) / 97 });
  ctx2d.clearRect(0, 0, W, H);
  ctx2d.drawImage(compositor.canvas, 0, 0);
  statEl.textContent = `seed ${seed} · ${teeth.length} teeth · ${W}×${H} @${DPR}x · mask ${tMask.toFixed(1)}ms · KM ${tKM.toFixed(1)}ms`;
}

function apply(k) {
  k = (k || '').toLowerCase();
  if (k === 'r') { seed = (seed * 7 + 1) & 0xffff; render(); }
  else if (k === 's') {
    const a = document.createElement('a');
    a.href = stage.toDataURL('image/png');
    a.download = `tuft_plate_seed${seed}.png`;
    document.body.appendChild(a); a.click(); a.remove();
  } else if (k === 'h') { hud.classList.toggle('hide'); }
}
window.addEventListener('keydown', e => {
  if (['r', 'R', 's', 'S', 'h', 'H'].includes(e.key)) { apply(e.key); e.preventDefault(); }
});
document.querySelectorAll('#hud button').forEach(b => b.addEventListener('click', () => apply(b.dataset.k)));

try {
  compositor = createCompositor(W, H);
  render();
} catch (e) {
  statEl.textContent = 'FATAL: ' + e.message;
  statEl.style.color = '#e07a5f';
  console.error(e);
}
</script>
</body>
</html>
