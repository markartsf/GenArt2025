<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Brushstroke v3 — Multi-Variant Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- STRICT VERSION LOCKING -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>

    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #f4f1ea; }
        canvas { display: block; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        input[type="file"] { display: none; }
        .custom-file-upload {
            cursor: pointer;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="antialiased font-sans">

    <!-- === SAFARI-SAFE NATIVE AUDIO ELEMENT === -->
    <audio id="nativeAudio" style="display:none;"></audio>

    <!-- === UI OVERLAY === -->
    <div class="fixed bottom-6 left-1/2 transform -translate-x-1/2 flex gap-4 z-10 glass-panel px-6 py-3 rounded-full shadow-lg items-center">
        <!-- Load Track -->
        <label class="custom-file-upload px-4 py-2 rounded-full font-medium text-gray-800 text-sm hover:bg-white/60">
            <input type="file" id="audioUpload" accept="audio/*" />
            <span id="uploadLabel">1. Load Ambient Track</span>
        </label>

        <div class="w-px h-6 bg-gray-400 opacity-50"></div>

        <!-- BRUSH VARIANT SELECTOR -->
        <div class="flex items-center gap-2 px-2">
            <svg class="w-4 h-4 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path></svg>
            <select id="brushSelect" class="bg-transparent text-gray-800 font-bold text-sm outline-none cursor-pointer appearance-none pr-4">
                <option value="enfantines">Variant A: Enfantines Ribbon</option>
                <option value="cloud">Variant B: Ethereal Cloud</option>
                <option value="fibers">Variant C: Woven Fibers</option>
            </select>
        </div>

        <div class="w-px h-6 bg-gray-400 opacity-50"></div>

        <!-- Play / Clear -->
        <button id="playBtn" class="px-4 py-2 rounded-full font-medium text-gray-800 text-sm hidden hover:bg-white/60 transition-colors">2. Play</button>
        <button id="clearBtn" class="px-4 py-2 rounded-full font-medium text-gray-800 text-sm hover:bg-white/60 transition-colors">Clear Canvas</button>
    </div>

    <script>
        let fft, isPlaying = false, isLoaded = false;
        const nativeAudio = document.getElementById('nativeAudio');
        let audioSourceNode;

        const palette = ["#1b3a5c", "#3a5f70", "#668c81", "#c9a653", "#825d7b", "#4a2c52", "#d98c52"];
        let ribbons = [];
        const NUM_RIBBONS = 3;

        // === BRUSH PRESET ENGINE ===
        // Two brush types:
        //   'comb'   — one wandering path that lays down PERPENDICULAR teeth
        //              at regular spacing; colors cycle through a gradient
        //              tooth-by-tooth. This is the Enfantines model.
        //   'ribbon' — parallel strands offset from a wandering path
        //              (cloud & fibers — atmospheric textures).
        const BRUSH_PRESETS = {
            enfantines: {
                type: 'comb',
                teethSpacing: 9,                 // px between teeth along path
                toothLengthRange: [10, 35],      // perpendicular half-length, low→high audio energy
                toothWeightRange: [3, 6],        // base tooth stroke weight
                weightJitter: 0.20,              // ±20% per-tooth weight variation
                lengthJitter: 0.15,              // ±15% per-tooth length variation
                angleJitter: 7,                  // ° of perpendicular randomization per tooth
                skipProb: 0.06,                  // occasional missing tooth
                colorCyclePeriod: 18,            // teeth per full gradient cycle
                opacity: 92
            },
            cloud: {
                type: 'ribbon',
                strands: 12,
                spreadRange: [10, 45],
                weightRange: [15, 70],
                wiggle: 5,
                opacity: 12,
                style: 'grain'
            },
            fibers: {
                type: 'ribbon',
                strands: 24,
                spreadRange: [15, 65],
                weightRange: [1, 2.5],
                wiggle: 15,
                opacity: 45,
                style: 'grain'
            }
        };

        let currentPreset = 'enfantines'; // Default

        // === DOM BINDINGS ===
        document.getElementById('audioUpload').addEventListener('change', handleFileUpload);
        document.getElementById('playBtn').addEventListener('click', togglePlay);
        document.getElementById('clearBtn').addEventListener('click', clearCanvas);

        document.getElementById('brushSelect').addEventListener('change', (e) => {
            currentPreset = e.target.value;
            rebuildStrands();
        });

        function clearCanvas() {
            blendMode(BLEND);
            background('#f4f1ea');
            blendMode(MULTIPLY);
        }

        // === SAFARI AUDIO ENGINE ===
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('uploadLabel').innerText = "Loading...";
            nativeAudio.src = URL.createObjectURL(file);
            nativeAudio.load();

            nativeAudio.oncanplaythrough = () => {
                isLoaded = true;
                document.getElementById('uploadLabel').innerText = "Track Loaded";
                document.getElementById('playBtn').classList.remove('hidden');
            };
        }

        function togglePlay() {
            if (!isLoaded) return;
            const btn = document.getElementById('playBtn');

            if (nativeAudio.paused) {
                let audioCtx = getAudioContext();
                if (audioCtx.state !== 'running') audioCtx.resume();

                if (!audioSourceNode) {
                    audioSourceNode = audioCtx.createMediaElementSource(nativeAudio);
                    audioSourceNode.connect(audioCtx.destination);
                    fft.setInput(audioSourceNode);
                }

                nativeAudio.play().then(() => {
                    isPlaying = true;
                    btn.innerText = "Pause Track";
                }).catch(e => console.error("Safari blocked playback:", e));

            } else {
                nativeAudio.pause();
                isPlaying = false;
                btn.innerText = "Play Track";
            }
        }

        nativeAudio.addEventListener('ended', () => {
            isPlaying = false;
            document.getElementById('playBtn').innerText = "Play Track";
        });

        // === P5.JS LIFECYCLE ===
        function setup() {
            createCanvas(windowWidth, windowHeight);
            angleMode(RADIANS);
            fft = new p5.FFT(0.85, 128);

            for(let i = 0; i < NUM_RIBBONS; i++) {
                ribbons.push({
                    x: random(width), y: random(height),
                    seed: random(10000),
                    flowSpeed: random(0.001, 0.0025),
                    strands: []
                });
            }
            rebuildStrands();
            clearCanvas();
        }

        function rebuildStrands() {
            let preset = BRUSH_PRESETS[currentPreset];
            ribbons.forEach(r => {
                r.strands = [];
                // Comb-state (always reset; cheap)
                r.distAcc = 0;
                r.toothCount = Math.floor(random(0, 30));  // stagger color phase per brush
                r.prevX = r.x;
                r.prevY = r.y;
                if (preset.type === 'ribbon') {
                    for (let j = 0; j < preset.strands; j++) {
                        r.strands.push({
                            offset: map(j, 0, preset.strands - 1, -1, 1),
                            color: color(random(palette)),
                            wiggleSeed: random(1000),
                            lastX: r.x, lastY: r.y
                        });
                    }
                }
            });
        }

        // Sample a smooth gradient over the palette at parameter t in [0,1].
        // Wraps for cyclic colour marches.
        function sampleGradient(pal, t) {
            t = ((t % 1) + 1) % 1;
            const scaled = t * pal.length;
            const i0 = Math.floor(scaled) % pal.length;
            const i1 = (i0 + 1) % pal.length;
            const lt = scaled - Math.floor(scaled);
            return lerpColor(color(pal[i0]), color(pal[i1]), lt);
        }

        // Comb-brush step: walk along the path and lay perpendicular teeth at
        // regular distance intervals. Each tooth's colour is sampled from the
        // gradient based on the brush's accumulated tooth count.
        function drawCombStep(r, angle, activeEnergy, preset) {
            const stepDist = dist(r.prevX, r.prevY, r.x, r.y);
            r.distAcc += stepDist;
            const perpAngle = angle + HALF_PI;
            const toothLen = map(activeEnergy, 60, 255, preset.toothLengthRange[0], preset.toothLengthRange[1]);
            const toothWt  = map(activeEnergy, 60, 255, preset.toothWeightRange[0], preset.toothWeightRange[1]);

            while (r.distAcc >= preset.teethSpacing) {
                // Interpolate the tooth's anchor along this frame's segment
                const overshoot = r.distAcc - preset.teethSpacing;
                const t = stepDist > 0 ? Math.max(0, Math.min(1, (stepDist - overshoot) / stepDist)) : 1;
                const px = lerp(r.prevX, r.x, t);
                const py = lerp(r.prevY, r.y, t);

                r.distAcc -= preset.teethSpacing;
                r.toothCount++;

                // Random skip — leaves occasional organic gaps in the comb
                if (preset.skipProb && Math.random() < preset.skipProb) continue;

                // Per-tooth perpendicular angle jitter
                const angleJit = preset.angleJitter
                    ? (Math.random() * 2 - 1) * preset.angleJitter * Math.PI / 180
                    : 0;
                const perpJ = perpAngle + angleJit;

                // Per-tooth weight + length jitter
                const wJ = preset.weightJitter
                    ? toothWt * (1 + (Math.random() * 2 - 1) * preset.weightJitter)
                    : toothWt;
                const lJ = preset.lengthJitter
                    ? toothLen * (1 + (Math.random() * 2 - 1) * preset.lengthJitter)
                    : toothLen;

                const colorT = (r.toothCount / preset.colorCyclePeriod) % 1;
                const col = sampleGradient(palette, colorT);
                col.setAlpha(preset.opacity);
                stroke(col);
                strokeWeight(wJ);
                strokeCap(SQUARE);
                line(
                    px - Math.cos(perpJ) * lJ,
                    py - Math.sin(perpJ) * lJ,
                    px + Math.cos(perpJ) * lJ,
                    py + Math.sin(perpJ) * lJ
                );
            }
            r.prevX = r.x;
            r.prevY = r.y;
        }

        // --- MULTI-STYLE RENDER ENGINE ---
        function drawTexturedStrand(lx, ly, nx, ny, weight, c, preset) {
            c.setAlpha(preset.opacity);
            stroke(c);

            if (preset.style === 'solid') {
                strokeWeight(weight);
                strokeCap(SQUARE);
                line(lx, ly, nx, ny);

                c.setAlpha(preset.opacity * 0.4);
                stroke(c);
                strokeWeight(weight * 0.4);
                line(lx, ly, nx, ny);
            } else {
                let d = dist(lx, ly, nx, ny);
                let steps = Math.max(1, d * 2);
                for(let i = 0; i <= steps; i++) {
                    let t = i / steps;
                    let px = lerp(lx, nx, t);
                    let py = lerp(ly, ny, t);

                    let numGrains = Math.floor(weight * 0.5);
                    for(let g = 0; numGrains > 0 && g < numGrains; g++) {
                        let angle = random(TWO_PI);
                        let r = pow(random(), 2) * (weight * 0.5);
                        strokeWeight(random(0.5, 1.5));
                        point(px + cos(angle) * r, py + sin(angle) * r);
                    }
                }
            }
        }

        function draw() {
            if (!isPlaying) return;
            fft.analyze();
            let bass = fft.getEnergy("bass"), lowMid = fft.getEnergy("lowMid"), treble = fft.getEnergy("treble");
            let activeEnergy = Math.max(bass, lowMid);

            let preset = BRUSH_PRESETS[currentPreset];

            ribbons.forEach((r) => {
                let angle = noise(r.seed + frameCount * r.flowSpeed) * TWO_PI * 4;
                let speed = 1.5 + map(treble, 0, 255, 0, 3);

                r.x += cos(angle) * speed;
                r.y += sin(angle) * speed;

                let wrapped = false;
                if (r.x > width + 100) { r.x = -100; wrapped = true; }
                if (r.x < -100) { r.x = width + 100; wrapped = true; }
                if (r.y > height + 100) { r.y = -100; wrapped = true; }
                if (r.y < -100) { r.y = height + 100; wrapped = true; }

                // After wrap, reset prev to avoid drawing a tooth/strand that
                // jumps across the canvas.
                if (wrapped) {
                    r.prevX = r.x; r.prevY = r.y;
                    r.distAcc = 0;
                    r.strands.forEach(s => { s.lastX = r.x; s.lastY = r.y; });
                    return;
                }

                if (preset.type === 'comb') {
                    if (activeEnergy > 60) {
                        drawCombStep(r, angle, activeEnergy, preset);
                    } else {
                        r.prevX = r.x; r.prevY = r.y;
                    }
                    return;
                }

                // --- ribbon (parallel strands) ---
                let perpAngle = angle + HALF_PI;
                let ribbonSpread = map(activeEnergy, 60, 255, preset.spreadRange[0], preset.spreadRange[1]);
                let strandWeight = map(activeEnergy, 60, 255, preset.weightRange[0], preset.weightRange[1]);

                r.strands.forEach((s) => {
                    let wiggle = (noise(s.wiggleSeed + frameCount * 0.02) - 0.5) * preset.wiggle;
                    let targetX = r.x + cos(perpAngle) * (s.offset * ribbonSpread + wiggle);
                    let targetY = r.y + sin(perpAngle) * (s.offset * ribbonSpread + wiggle);
                    let curX = lerp(s.lastX || targetX, targetX, 0.2);
                    let curY = lerp(s.lastY || targetY, targetY, 0.2);
                    if (activeEnergy > 60) {
                        drawTexturedStrand(s.lastX, s.lastY, curX, curY, strandWeight, s.color, preset);
                    }
                    s.lastX = curX;
                    s.lastY = curY;
                });
            });
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            clearCanvas();
        }
    </script>
</body>
</html>
