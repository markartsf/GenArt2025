<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GenArt2025 - Audio-Responsive Generative Art</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', monospace;
      background: #1a0a0a;
      color: #f5deb3;
      overflow: hidden;
    }

    #container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #controls {
      padding: 20px;
      background: rgba(26, 10, 10, 0.95);
      border-bottom: 2px solid rgba(205, 92, 92, 0.3);
      z-index: 10;
    }

    #canvas-container {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }

    .control-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input[type="file"] {
      background: #222;
      color: #fff;
      padding: 8px;
      border: 1px solid #444;
      border-radius: 3px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
    }

    input[type="file"]::-webkit-file-upload-button {
      background: #444;
      color: #fff;
      border: none;
      padding: 5px 10px;
      border-radius: 3px;
      cursor: pointer;
      margin-right: 10px;
    }

    select {
      background: #222;
      color: #fff;
      padding: 8px;
      border: 1px solid #444;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      width: 250px;
    }

    button {
      background: #444;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 3px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      margin-right: 10px;
    }

    button:hover {
      background: #555;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #audio-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-top: 15px;
      font-size: 11px;
    }

    .info-item {
      background: rgba(40, 20, 15, 0.8);
      padding: 8px;
      border-radius: 3px;
      border: 1px solid rgba(205, 92, 92, 0.3);
    }

    .info-label {
      color: #c8a882;
      margin-bottom: 3px;
    }

    .info-value {
      color: #f4a460;
      font-weight: bold;
    }

    .controls-row {
      display: flex;
      gap: 20px;
      align-items: flex-end;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="controls">
      <div class="controls-row">
        <div class="control-group">
          <label for="audioFile">Audio File</label>
          <input type="file" id="audioFile" accept="audio/*">
        </div>
        <div class="control-group">
          <label for="sketchSelect">Visualization</label>
          <select id="sketchSelect">
            <optgroup label="Audio-Responsive">
              <option value="rhythmGrid" selected>🥁 Rhythm Grid</option>
              <option value="timbreSpectrum">🎵 Timbre Spectrum</option>
              <option value="neonPainter">🎨 Neon Painter</option>
            </optgroup>
            <optgroup label="Light Trails">
              <option value="lightHighway">💡 Light Highway</option>
              <option value="chromaticFlow">🌊 Chromatic Flow</option>
            </optgroup>
            <optgroup label="Geometric Patterns">
              <option value="galaxy">🌟 Spiral Galaxy</option>
              <option value="tree">🌳 Fractal Tree</option>
              <option value="kaleidoscope">🔷 Chromatic Kaleidoscope</option>
            </optgroup>
            <optgroup label="Attractors & Particles">
              <option value="lorenz">Lorenz Attractor</option>
              <option value="rossler">Rössler Attractor</option>
              <option value="particles">Particle Field</option>
              <option value="waveform">Audio Waveform</option>
            </optgroup>
          </select>
        </div>
        <div class="control-group">
          <label>&nbsp;</label>
          <button id="playPause" disabled>Play</button>
          <button id="stop" disabled>Stop</button>
        </div>
      </div>
      <div id="audio-info"></div>
    </div>
    <div id="canvas-container">
      <canvas id="canvas"></canvas>
    </div>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
