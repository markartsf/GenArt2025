<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Reactive Particles</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Controls overlay — top left */
    #info-container {
      position: fixed;
      top: 0; left: 0;
      padding: 14px 18px;
      background: rgba(0, 0, 0, 0.65);
      border-bottom-right-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }

    #info-container h1 {
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #aad4ff;
      margin: 0;
    }

    #status {
      font-size: 11px;
      color: #80aacc;
      min-height: 14px;
    }

    #buttons {
      display: flex;
      gap: 8px;
    }

    button {
      background: #1a2a3a;
      color: #cce0ff;
      border: 1px solid rgba(120, 180, 255, 0.3);
      padding: 5px 14px;
      border-radius: 3px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      letter-spacing: 1px;
    }
    button:hover  { background: #223344; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }

    input[type="file"] {
      font-size: 11px;
      color: #80aacc;
      cursor: pointer;
    }

    /* Sliders — bottom left */
    #controls-container {
      position: fixed;
      bottom: 0; left: 0;
      padding: 14px 18px;
      background: rgba(0, 0, 0, 0.55);
      border-top-right-radius: 10px;
      z-index: 10;
    }

    #controls .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    #controls label {
      font-size: 11px;
      color: #80aacc;
      min-width: 130px;
      letter-spacing: 1px;
    }

    #controls input[type="range"] {
      width: 130px;
      accent-color: #4488cc;
    }
  </style>
</head>
<body>

  <div id="canvas-container">
    <canvas id="canvas"></canvas>
  </div>

  <div id="info-container">
    <h1>Audio Reactive Particles</h1>
    <div id="buttons">
      <button id="playPause" disabled>Play</button>
      <button id="stop" disabled>Stop</button>
      <button id="reset">Reset Cam</button>
    </div>
    <input type="file" id="audioFile" accept=".mp3,audio/*">
    <span id="status">Upload an MP3 to begin.</span>
  </div>

  <div id="controls-container">
    <div id="controls"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
